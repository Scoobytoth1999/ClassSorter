<title>Four Years · Course Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2340; --ink2:#4B5370; --ink3:#8A90A6; --line:#E3E5EC; --bg:#F4F5F8; --card:#FFFFFF;
  --warn:#C2410C; --warnbg:#FFF1E8; --ok:#15803D; --okbg:#EAF7EE; --info:#3B4A8C; --infobg:#EEF0FA;
  --eng:#E0507A; --math:#3D6FE0; --wl:#8A5BD6; --sci:#159A7E; --hist:#D98A12; --rel:#7E8F2E;
  --fine:#EC6B3F; --perf:#B8408F; --cse:#4B5B78; --health:#2CA3C9; --x:#6B6476;
  --disp:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--math);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,245,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.05}
.top .sub{color:var(--ink2);font-size:14px;margin-top:2px;display:flex;gap:6px;align-items:center}
.planbtn{background:none;border:0;padding:0;font-weight:600;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.yearnav{display:flex;gap:6px;margin-top:10px}
.yearnav button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 0;font-weight:600;font-size:14px;position:relative}
.yearnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.yearnav .dot{position:absolute;top:3px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

main{padding:12px 12px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* year */
.year{margin:6px 0 26px;scroll-margin-top:130px}
.yhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.yhead h2{font-family:var(--disp);font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em}
.yhead h2 small{font-size:15px;font-weight:400;color:var(--ink3);margin-left:6px;letter-spacing:0}
.ystat{font-size:13px;color:var(--ink2);text-align:right}
.shelf{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.colh{font-size:12px;color:var(--ink3);font-weight:600;padding:0 4px 2px}
.span2{grid-column:1/3}
.blk{--c:var(--x);position:relative;display:block;width:100%;text-align:left;border:0;border-radius:10px;background:color-mix(in srgb,var(--c) 13%,#fff);padding:8px 10px 8px 14px;min-height:46px;cursor:pointer;overflow:hidden}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.blk .t{font-weight:600;font-size:14.5px;line-height:1.2;display:block;padding-right:16px}
.blk .m{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
.blk .flag{position:absolute;top:7px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.blk.full{min-height:44px}
.blk.big{min-height:58px}
.adds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.add{border:1.5px dashed #C9CDD9;background:transparent;border-radius:10px;padding:9px 4px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.add:active{background:#fff}
.notes{margin:8px 2px 0;display:flex;flex-direction:column;gap:5px}
.note{font-size:13.5px;border-radius:10px;padding:7px 10px;background:var(--warnbg);color:#7C2D12;line-height:1.3}
.note.info{background:var(--infobg);color:var(--info)}
.empty-sem{font-size:12.5px;color:var(--ink3);padding:10px 6px;text-align:center;border-radius:10px;background:var(--bg)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button.on{color:var(--ink)}
.tabs svg{width:24px;height:24px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;min-width:17px;line-height:17px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(27,35,64,.38);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet .sh{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 8px}
.sheet .sh h3{margin:0;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.01em;flex:1;line-height:1.15}
.x{border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px}
.sheet .sb{overflow:auto;padding:0 16px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* picker */
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);padding:2px 0 8px}
.toggle input{width:18px;height:18px}
.row{--c:var(--x);display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line)}
.row .bar{width:5px;border-radius:3px;background:var(--c);flex:none}
.row .rt{font-weight:600;font-size:15px;line-height:1.25}
.row .rm{font-size:12.5px;color:var(--ink2);margin-top:2px}
.row .rs{font-size:12.5px;margin-top:3px;color:var(--warn)}
.row .rs.ok{color:var(--ok)}
.row.dim{opacity:.55}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--bg);color:var(--ink2)}
.tag.ap{background:#FDE9F0;color:#9D174D}
.tag.h{background:#EEF2FF;color:#3730A3}
.tag.rec{background:#FEF3C7;color:#92400E}

/* detail */
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:4px 0 12px}
.facts dt{color:var(--ink3)}
.facts dd{margin:0}
.desc{font-size:15px;line-height:1.55;color:var(--ink);max-width:66ch}
.status{border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.status.bad{background:var(--warnbg);color:#7C2D12}
.status.good{background:var(--okbg);color:#14532D}
.status.inf{background:var(--infobg);color:var(--info)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;flex:1;min-width:120px}
.btn.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #F3C9B5}
.btn:disabled{opacity:.4}

/* check view */
.sect{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;margin-bottom:14px}
.sect h2{font-family:var(--disp);font-size:21px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sect .lede{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .n{font-weight:600;font-size:14.5px}
.req .v{font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.req .v.done{color:var(--ok);font-weight:700}
.meter{grid-column:1/3;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--c,var(--ink))}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.chk:first-of-type{border-top:0}
.chk .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:var(--ink3)}
.chk.ok .ic{background:var(--ok)}
.chk.no .ic{background:var(--warn)}
.chk small{display:block;color:var(--ink2);font-size:12.5px}
table.load{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.load th,table.load td{padding:6px 4px;text-align:center;border-top:1px solid var(--line)}
table.load th{font-size:12px;color:var(--ink3);font-weight:600;border-top:0}
table.load td:first-child,table.load th:first-child{text-align:left}
td.bad{color:var(--warn);font-weight:700}
.acts{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;align-items:center;font-size:13px}
.acts .h{font-size:12px;color:var(--ink3);font-weight:600}
.acts input{width:100%;font:inherit;font-size:14px;padding:8px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.acts .g{font-weight:700;font-family:var(--disp);font-size:17px}

.depts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px}
.dept{--c:var(--x);border:0;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,#fff);padding:12px 12px 10px;text-align:left;position:relative;overflow:hidden;min-height:68px}
.dept::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.dept b{display:block;font-size:15px;line-height:1.2}
.dept span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.qhead{font-family:var(--disp);font-weight:800;font-size:17px;margin:14px 0 2px}
.qrow{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-bottom:1px solid var(--line)}
.qrow .rt{font-weight:600;font-size:15px}
.qrow .rm{font-size:12.5px;color:var(--ink3);margin-top:1px}
.qrow .bl{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.35}
.sechead{font-family:var(--disp);font-weight:800;font-size:19px;margin:4px 4px 8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 0;font-weight:700;font-size:14.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,35,64,.15)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips .chip{white-space:normal;text-align:left}
.wrow{--c:var(--x);display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.wrow .wt{flex:1;min-width:0}.wrow .wt b{display:block;font-size:14.5px;line-height:1.25}.wrow .wt small{color:var(--ink3);font-size:12.5px}
.mchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.mchip.on{background:#FDE9F0;border-color:#F5B8CD;color:#9D174D}
.rmx{flex:none;border:0;background:none;color:var(--ink3);font-size:16px;width:30px;height:30px}
.btn.big{padding:15px;font-size:16.5px}
.heart{flex:none;align-self:center;font-size:22px;color:var(--ink3);width:30px;text-align:center}
.heart.on{color:#D6336C}
.row .bl{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.qcard{border:2px solid #F5C9A9;background:#FFFAF5}
.qlist{margin:0 0 4px;padding-left:20px;font-size:14.5px}.qlist li{margin:3px 0}
.tline{font-size:14.5px;padding:7px 0;border-top:1px solid var(--line);line-height:1.4}
.tline:first-of-type{border-top:0}
.erow{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.linkb{border:0;background:none;padding:0;color:var(--math);font-weight:700;font-size:12.5px;text-decoration:underline}
.pv{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pv:first-of-type{border-top:0}
.pvg{font-family:var(--disp);font-weight:800;font-size:17px}
.pvl{display:flex;flex-wrap:wrap;gap:5px}
.pvc{--c:var(--x);font-size:13px;font-weight:600;border-radius:7px;padding:3px 8px;background:color-mix(in srgb,var(--c) 15%,#fff);border-left:4px solid var(--c)}
.pvc small{font-weight:400;color:var(--ink2)}
/* explore */
.ex-head{padding:2px 4px 8px}
.ex-head p{margin:0;color:var(--ink2);font-size:14px}

/* more */
.list button.item{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:12px 2px;border-top:1px solid var(--line);font-size:15px}
.list button.item:first-child{border-top:0}
.list .cur{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok)}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
select,input.tx{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.fine{font-size:13px;color:var(--ink2);line-height:1.5}

.ladder{margin:10px 2px 0}
.ladder .rungs{display:flex;gap:5px;align-items:flex-end;height:44px}
.ladder .rungs span{flex:1;border-radius:5px 5px 2px 2px;background:#DDE3F6;transition:background .2s}
.ladder .rungs span.past{background:#A9BCF0}
.ladder .rungs span.on{background:var(--math)}
.ladder .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-weight:600;margin-top:4px}
/* welcome */
.welcome{padding:6px 4px}
.welcome h2{font-family:var(--disp);font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:8px 0 10px}
.stack{display:flex;gap:5px;margin:18px 0 6px;height:120px;align-items:flex-end}

.toast.on{opacity:1;transform:translateX(-50%)}

<script>
const COURSES = [{"id": "1110", "nums": "1110", "t": "English 9: The Journey", "d": "eng", "term": "Y", "cr": 1, "g": [9], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Because all students who take English 9 are new to the Upper School, the course is focused on themes of transition, on “the journey” from one state to another. The class combines a careful analysis of literature with instruction in basic composition. Students also study vocabulary and topics in grammar. Core texts include Homer’s The Odyssey, Salinger’s The Catcher in the Rye, and Shakespeare’s A Midsummer Night’s Dream. Department-generated anthologies are used to teach poetry and short stories. Students are expected to participate in class discussions and are assessed through quizzes, timed writing, major essays, class presentations, other projects, and examinations.", "b": "Freshman English built around journeys and transitions, with lots of writing practice."}, {"id": "1210", "nums": "1210", "t": "World Literature", "d": "eng", "term": "Y", "cr": 1, "g": [10, 11], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "The texts in World Literature have been chosen to help students understand and respect different parts of the world while finding commonalities across cultures. The core texts include Reading the World (an anthology), Achebe’s Things Fall Apart, Chang’s Love in a Fallen City, Satrapi’s Persepolis, Esquivel’s Like Water for Chocolate, and Shakespeare’s Macbeth. Students also study vocabulary and topics in grammar; instructors devote significant time to teaching the writing process. Students are expected to participate in class discussions; assessments include quizzes, timed writing, major essays, class presentations, other projects, and examinations.", "b": "Novels, plays, and poems from around the world, compared across cultures."}, {"id": "1310", "nums": "1310", "t": "American Literature", "d": "eng", "term": "Y", "cr": 1, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course examines significant themes in American culture and introduces students to major American authors. Core texts include The Norton Anthology of American Literature, Fitzgerald’s The Great Gatsby, Miller’s Death of a Salesman, and Morrison’s Song of Solomon. Vocabulary enrichment continues. Students are expected to participate in class discussions and are assessed through quizzes, timed writing, major essays, class presentations, other projects, and examinations.", "b": "Major American authors and themes, from the founding era to The Great Gatsby."}, {"id": "1521", "nums": "1521", "t": "Humor in Literature", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Conventional wisdom holds that to analyze a joke is to spoil it. Yet laughter is one of the principal pleasures of reading. This course challenges students to take humor in literature more seriously. What important subcategories can be defined, such as satire, farce, irony, nonsense? What’s the difference between hearing a joke and reading one? How does humor function in different cultures? Are there topics which can be uniquely broached through humor — or are there some points which cannot be made any other way? Major texts include Cervantes’ Don Quixote (selections), Heller’s Catch-22, Kesey’s One Flew Over the Cuckoo’s Nest, and poetry and folktales from a spectrum of cultures. Modes of assessment include critical essays, oral presentations, textual explication, and creative writing.", "b": "Takes humor seriously: what makes writing funny, and what it reveals."}, {"id": "1565", "nums": "1565", "t": "Creative Nonfiction: Investigations", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Creative nonfiction might seem like a contradiction in terms. How creative can a writer be with true events? Writers in this genre of literature use many of the same techniques as fiction writers. They develop characters, advance the plot, define conflicts, and make allusions. The only difference is that the events in their stories really happened. This course explores an author’s process of following a story, seeing where it leads, and presenting the narrative in a compelling way. Texts include In Cold Blood by Truman Capote, Into the Wild by Jon Krakauer, and The Art Thief by Michael Finkel. Assessments include quizzes and critical essays. Students also follow a story of their own, investigating and writing a piece of original creative nonfiction.", "b": "Reading and writing true stories told with a fiction writer's tools."}, {"id": "1551", "nums": "1551", "t": "Shakespeare", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "The course aim is for students to develop reading strategies to understand and enjoy Shakespeare’s plays, and to read them in a critical way. The class exposes students to three of his best-known works using a range of approaches, from reading and discussing the plays to watching and comparing modern adaptations; from performing short scenes to reciting favorite lines. The reading list typically includes Hamlet, Much Ado About Nothing and King Lear. Assessments include class discussion, quizzes, short presentations, and a final paper.", "b": "Learn to read, enjoy, and analyze three of Shakespeare's best-known plays."}, {"id": "1553", "nums": "1553", "t": "Heroes in British Literature", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "This course explores the shifting values in major British works by examining how authors define what it means to be heroic as well as analyzing the heroic codes characters maintain for themselves. Students will also consider how characters in the works challenge these heroic ideals. Representative readings will include Heaney’s translation of Beowulf, portions of Chaucer’s The Canterbury Tales, Austen’s Pride and Prejudice, and selected essays and poetry. Students will primarily write critical essays and occasional in-class papers. Other assessments may include short translation exercises, student-led discussion, presentations, and a final paper.", "b": "How British writers define heroism, and how those ideas change over time."}, {"id": "1563", "nums": "1563", "t": "The Stranger in World Literature", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "The readings—mainly short modern novels—deal with themes of alienation, perception, and the dynamics of a post-colonial landscape. The settings for the narratives, which involve conflict and questions of legitimacy, are in North Africa and the Middle East. The crossroads of the East and the West (or North and South) in this region of the world are particularly acute and symbolic. The main characters in the readings are caught, or find themselves, in “the middle:” not quite here, not quite there. This dual state of being leads to questions of self-knowledge, authenticity, and meaning. External conflicts inherent in the setting are reflected in internal conflicts. Thus, individuals struggle to make sense of their surroundings that are at once strange and familiar. The resulting alienation—an outsider status—is a central motif in the course. Assessments include class discussion, short response papers, short presentations, and an end-of-semester paper or exam.", "b": "Short modern novels about outsiders and alienation, set around the world."}, {"id": "1559", "nums": "1559", "t": "Americans in Paris", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Over the course of the long twentieth-century, many quintessentially American authors have treated Paris as a site of intellectual pilgrimage. During their time in the City of Light, many of these authors created some of the most searing portraits of life back in the United States. Thus, the purpose of this course is to begin questioning how the experience of expatriation helped writers think more clearly and critically about the places and cultures from which they emerged. Beginning with Edith Wharton’s scathing critique, The Custom of the Country, moving to the meditations of the Lost Generation, and ending with the postwar ruminations of James Baldwin, texts invite students to understand Paris as one of the most important sites of American literary innovation. Over the course of the semester, students are asked to write at least one critical essay, in addition to several collaborative creative projects.", "b": "American writers who found inspiration living in Paris in the 1900s."}, {"id": "1555", "nums": "1555", "t": "Immigration, Race, and Identity", "d": "eng", "term": "S1", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "In the eighteenth century, Hector St. John De’Crevecoeur wrote exuberantly about the ways in which America would act as a nurturing parent for the immigrant, who “becomes an American by being received in the broad lap of our great Alma Mater [dear mother].” This course explores the elusive nature of that Alma Mater, as it is depicted in contemporary American fiction. Through the voices of diverse authors, we examine the tension of simultaneously existing within and apart from multiple cultures, as well as the challenges of negotiating a sense of belonging in America while maintaining a connection to the countries that characters once considered “home.” Major texts may include The Namesake by Jhumpa Lahiri, Who’s Irish? by Gish Jen, The Brief Wondrous Life of Oscar Wao by Junot Diaz, and Woman Hollering Creek and Other Stories by Sandra Cisneros. Assessments include critical essays, class discussions, seminar-leading assignments, and a final paper.", "b": "Literature about immigrant experiences and what it means to become American."}, {"id": "1606", "nums": "1606", "t": "Creative Writing Workshop", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "This course is for students with a serious interest in writing and revising fiction, poetry, or essays (the narrative or reflective essay — not the critical essay). Most days the class consists of reviewing students’ own work in the “workshop” model of group critique. We also study the work of current published writers. Students must produce at least one piece in each of the three genres mentioned above; after meeting this requirement, they may choose to concentrate on one genre. Weekly submissions of substantive, well-edited, original writing that follows specific guidelines are required. Students must help produce an atmosphere that is candid and critical but also compassionate and constructive. Assessment is based almost exclusively on creative writing assignments and revisions of same.", "b": "Write and revise your own fiction, poetry, or essays in a workshop with classmates."}, {"id": "1648", "nums": "1648", "t": "Sports Literature", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Some of the best American prose writing of the twentieth and twenty-first centuries is about sports. Writers not normally thought of as sports writers—Ernest Hemingway, David Foster Wallace, John Updike, and Bernard Malamud—have contributed to the literature of sport. This course traces sports writing as an art form that developed at a great pace in the twentieth century through the work of canonical sports writers such as Red Smith, Gay Talese, and David Halberstam. The main focus of the course is on literary figures like Wallace and Malamud who use sports as a platform to pursue meaningful topics about life, nature, character, and society. Jon Krakauer’s dramatic story of a group of climbers, including himself, on Mount Everest is a representative text in the course. Finally, the class looks at current articles on a variety of sports, often online. Assessments include class discussion, short response papers, short presentations, and an end-of-semester paper or exam.", "b": "Great writing about sports by authors like Hemingway and Updike."}, {"id": "1672", "nums": "1672", "t": "Creative Nonfiction: Memoir", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Memoir is a subgenre of creative nonfiction; it is typically the story of one event or period of time in a writer’s life. In a memoir, the writer attempts to make sense of the past by sharing scenes and reflecting upon them. Just as fiction writers do, memoirists employ literary techniques such as figurative language, imagery, and characterization. Memoir often wrestles with growing up, changing, apologizing, or grieving. While the focus tends to be inward, memoir can also comment on social issues and reflect universal ideas. Texts include Wild by Cheryl Strayed, Stay True by Hua Hsu, and The Glass Castle by Jeannette Walls. Students also write short memoirs and participate in a writing workshop. Other assessments include quizzes and critical essays.", "b": "Read memoirs and write your own story about a moment in your life."}, {"id": "1654", "nums": "1654", "t": "The Artist's Journey: Capturing the Creative Process", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "Writers, chefs, musicians, and other artists often link their artistic visions to their journeys. This course examines profiles of artists across media and identifies common themes in stories about how and where creatives come from, and how they express their creative visions. Representative texts may include James Joyce’s Portrait of the Artist as a Young Man and Gabrielle Hamilton’s Blood, Bones, and Butter. Assessments include student-led discussion, critical essays, personal narratives, short written responses, and a collaborative, interdisciplinary final project.", "b": "Profiles of artists, chefs, and musicians and the journeys behind their work."}, {"id": "1662", "nums": "1662", "t": "Imagined Spaces: Architecture in Fiction", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "From the moment students arrive at Cranbrook, they are invited to appreciate the architectural and aesthetic beauty that surrounds them; they are asked to recognize the impact of physical spaces on the educational process. Students begin the semester by considering the ways that Cranbrook architecturally enables and disables specific types of social interaction (possible encounters with archival materials). Students then move to encounter literary representations of architecture, examining the consequences of these architectures, and ultimately, recognizing that the built environment can both reinforce and challenge existing social structures. Loosely organized around types of architectures—the single-family home, the apartment building, the skyscraper, and the city streets—this course begins with the home’s role in reinforcing patriarchal family structures and domestic roles for women. Later, we consider the ways in which apartment buildings, institutional spaces and cityscapes begin to challenge the neat separation of spaces— male/female, upper/lower class, interior/exterior. Students can expect to complete at least one critical essay but may also be asked to use architectural modeling to envision and interrogate the significance of literary spaces.", "b": "How buildings and places shape stories, inspired by Cranbrook's own architecture."}, {"id": "1664", "nums": "1664", "t": "Searching for Meaning in Modern Literature", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "The course proposes a fundamental tension between worldly and spiritual existence that figures into one’s search for selfunderstanding and meaning in life. Readings and discussion illuminate this tension and examine the ways characters cope with suffering and doubt, loneliness and alienation, love and envy, triumph and defeat. The class will look at texts in which characters work to interpret the world in which they live and come to some self-understanding in the process. Texts include Samuel Beckett’s Waiting for Godot, Tomas Rivera’s And the Earth Did Not Devour Him, James Baldwin’s The Fire Next Time, and John Steinbeck’s Of Mice and Men, along with short stories and non-fiction pieces. Assessments include class discussion, response papers, quizzes, short presentations, and a final paper.", "b": "Modern novels about characters searching for meaning and purpose."}, {"id": "1656", "nums": "1656", "t": "The Female Bildungsroman in Literature", "d": "eng", "term": "S2", "cr": 0.5, "g": [12], "appr": "", "pre": "", "req": "", "fl": "sr", "note": "", "desc": "A bildungsroman (German for “formation novel”) is a coming of age novel, traditionally a genre which follows a young man’s journey from childhood to adulthood. This course explores the more modern tradition of the female bildungsroman, examining the ways in which these female stories adhere to or subvert the genre, reflecting the pressures that gender and power exert on the more traditional story form. While female protagonists confront the questions of who they want to be, they also confront, directly or indirectly, how to freely seek these answers within or outside of the restrictions of gender roles. Primary texts may include Jane Eyre by Charlotte Bronte, Their Eyes Were Watching God by Zora Neale Hurston, and the graphic novel Persepolis by Marjane Satrapi. Assessments include critical essays, class discussions, seminar-leading assignments, and a final paper.", "b": "Coming-of-age novels centered on young women's journeys to adulthood."}, {"id": "2110", "nums": "2110", "t": "Algebra I", "d": "math", "term": "Y", "cr": 1, "g": [9, 10], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This first-year course in algebra covers single-variable linear equations and inequalities, including those using absolute values; the basic language and notation of functions; a detailed study of two-variable linear equations, including solving systems of equations; manipulating expressions with exponents and radicals, including operations on polynomials; and a detailed study of quadratics, including graphing parabolas, factoring, and the quadratic formula. Throughout the year students build their number sense and ability to work with numerical expressions as well as their ability to relate language to math through word problems.", "b": "First-year algebra: equations, inequalities, functions, and graphing."}, {"id": "2230", "nums": "2230", "t": "Geometry Essentials", "d": "math", "term": "Y", "cr": 1, "g": [9, 10], "appr": "", "pre": "Algebra I", "req": "2110", "fl": "", "note": "", "desc": "This course covers all of the fundamental topics studied in Geometry but at a more accessible pace and appropriate depth of concepts for the students who need to have basic skills reinforced. The essentials of Euclidean geometry are studied at length, with less emphasis being placed upon the development of proofs. The subsequent course path would be Algebra II Essentials followed by Pre- Calculus Essentials.", "b": "Core geometry topics at a steadier pace with extra skill support."}, {"id": "2210", "nums": "2210", "t": "Geometry", "d": "math", "term": "Y", "cr": 1, "g": [9, 10], "appr": "", "pre": "Algebra I", "req": "2110", "fl": "", "note": "", "desc": "This is a basic course in Euclidean plane geometry with an emphasis on deductive reasoning and proof. The topics covered include parallel and perpendicular lines, congruence, similarity, right triangles and trigonometry, polygons, circles, area and volume formulas. Concepts and techniques from algebra are reviewed throughout the year to prepare the student for subsequent algebra-based mathematics courses.", "b": "Plane geometry with a focus on logical reasoning and proofs."}, {"id": "2330", "nums": "2330", "t": "Algebra II Essentials", "d": "math", "term": "Y", "cr": 1, "g": [10, 11], "appr": "", "pre": "Geometry or Geometry Essentials", "req": "2210|2230", "fl": "", "note": "", "desc": "This course covers all of the fundamental topics studied in Algebra II but at a more accessible pace and appropriate depth of concepts for the students who may need to have basic skills reinforced. Emphasis is on developing self-confidence in students and improving their ability to understand the structure in problem-solving with algebra. The subsequent course is Pre-Calculus Essentials.", "b": "Core Algebra II topics at a steadier pace with extra skill support."}, {"id": "2310", "nums": "2310", "t": "Algebra II", "d": "math", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "", "pre": "Geometry", "req": "2210", "fl": "", "note": "", "desc": "Students in Algebra II re-examine in detail the major topics from Algebra I and are subsequently introduced to more advanced topics and techniques. Ideas covered in depth from both the graphical and the algebraic perspectives include linear functions, equations, and inequalities; absolute value functions, equations, and inequalities; systems of linear equations and inequalities; rational exponents; radical expressions and equations; and quadratic equations and functions. The reﬁnement of problem-solving techniques and the algebraic process are emphasized in order to facilitate their work with complex numbers; higher order polynomial functions, equations, and inequalities; and rational functions, equations, and inequalities. Familiarity with these algebraic concepts leads to the introduction of exponential and logarithmic functions and equations.", "b": "Revisits Algebra I in depth, then moves to functions, exponents, and logarithms."}, {"id": "2330PA", "nums": "2330*", "t": "Pre-Analysis H", "d": "math", "term": "Y", "cr": 1, "g": [9, 10], "appr": "Dept. Rec.", "pre": "Dept. Rec.", "req": "2210", "fl": "h", "note": "The guide prints the same course number (2330) as Algebra II Essentials; confirm the number when registering.", "desc": "This course covers all of the topics studied in Algebra II in greater depth and at a faster pace, leaving time for a thorough study of Pre- Calculus level trigonometry. The topics studied include right, circular, and inverse trigonometric functions and their graphs, as well as analytic trigonometry. Additional topics may include combinatorics, conic sections, and matrix arithmetic. Students who demonstrate exceptional work in this class may be recommended for Advanced Topics: Analysis.", "b": "Honors Algebra II, faster and deeper, plus pre-calculus trigonometry."}, {"id": "2530", "nums": "2530", "t": "Pre-Calculus Essentials", "d": "math", "term": "Y", "cr": 1, "g": [11, 12], "appr": "", "pre": "Algebra II or Algebra II Essentials", "req": "2310|2330|2330PA", "fl": "", "note": "", "desc": "This course is designed to help students acquire a solid foundation in algebra and trigonometry, preparing them for the continued study of mathematics in college. A fundamental goal is to enable students to develop problem-solving skills, while fostering critical thinking, within an engaging setting. During the first semester critical algebra skills are further developed from an algebraic and graphing calculator perspective. Topics include a wide variety of equations, inequalities, functions and their graphs. Second semester introduces the basic concepts of trigonometry including right triangle and circular trigonometry, basic graphs and identities.", "b": "Solid algebra and trig foundations to prepare for college math."}, {"id": "2540", "nums": "2540", "t": "Pre-Calculus", "d": "math", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "", "pre": "Algebra II", "req": "2310|2330PA", "fl": "", "note": "", "desc": "This course is designed for students who have completed the core sequence in the Mathematics Department (Algebra I, Geometry, Algebra II). Pre-Calculus provides students with an opportunity to strengthen and expand their ability to analyze functions and use their mathematical abilities to solve real-life applications. Topics studied include exponential, linear, logarithmic, polynomial, rational, and radical functions. An investigation of sequences and series is also included. Trigonometry is the focus of the second semester. A possible additional topic is conic sections. The graphing calculator is employed to assist students in the study of these topics.", "b": "Strengthens algebra and trig skills after the core math sequence."}, {"id": "2550", "nums": "2550", "t": "Pre-Calculus H", "d": "math", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "", "pre": "Algebra II", "req": "2310|2330PA", "fl": "h", "note": "", "desc": "Pre-Calculus H is intended for motivated students whose work in Algebra II demonstrated a high level of mastery. Course topics include an in-depth study of functions (polynomial, rational, exponential, logarithmic and trigonometric), series and sequences, vectors, graphing techniques, polar equations, parametric equations, and limits. We emphasize developing functions and models that first-year AP Calculus students typically encounter.", "b": "Honors in-depth study of functions and trig to prepare for calculus."}, {"id": "2610", "nums": "2610", "t": "Advanced Topics: Analysis", "d": "math", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "Dept. Rec.", "pre": "Pre-Analysis H or equivalent with Dept. Rec.", "req": "2330PA", "fl": "ap", "note": "", "desc": "Advanced Topics: Analysis is intended for those students who have completed the core math courses by the end of their freshman year and are anticipating taking Advanced Calculus courses. Students are expected to enter the course with a full command of the topics covered in an advanced Algebra II course. The first semester will cover topics from Pre-Calculus such as trigonometry, series and sequences, vectors, polar functions, and parametric functions. The second semester will be dedicated to the study of topics from AP Calculus AB including limits, differentiation, and integration. Students are encouraged to take the AP Calculus AB exam. Successful completion of this course will allow students to move directly to Advanced Topics: Calculus II/III the following year.", "b": "An accelerated course for students heading into advanced calculus early."}, {"id": "2600", "nums": "2600", "t": "Calculus", "d": "math", "term": "Y", "cr": 1, "g": [11, 12], "appr": "", "pre": "Pre-Calculus", "req": "2540|2550|2530", "fl": "", "note": "", "desc": "This course introduces students to the calculus concepts of the limit, derivative, and integral. Formulas and techniques are developed for each of these concepts, which the students use to evaluate mathematical and real-life problem scenarios.", "b": "An introduction to limits, derivatives, and integrals with real-world problems."}, {"id": "2660", "nums": "2660", "t": "AP Calculus AB", "d": "math", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "", "pre": "Pre-Calculus H", "req": "2550|2540|2600", "fl": "ap", "note": "", "desc": "This course covers the topics of the differential and integral calculus as described in the AB syllabus of the Advanced Placement Program and prepares students for the Calculus AB examination, given in May. Additional topics are presented after the examination. Students enrolled in this class are expected to take the AP Examination in May.", "b": "College-level calculus that prepares you for the AP Calculus AB exam."}, {"id": "2670", "nums": "2670", "t": "AP Calculus BC", "d": "math", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Pre-Calculus H, Calculus, AP Calculus AB, or AT: Analysis with Dept. Rec.", "req": "2550|2600|2660|2610", "fl": "ap", "note": "", "desc": "This course covers the topics of differential and integral calculus as described in the BC syllabus of the Advanced Placement Program and prepares students for the Calculus BC examination, given in May. Additional topics are presented after the examination. Students enrolled in this class are expected to take the AP Calculus BC examination in May. This is a terminal course in Calculus and is not intended for students wishing to take Advanced Topics mathematics courses.", "b": "The full BC calculus syllabus, preparing you for the AP Calculus BC exam."}, {"id": "2700", "nums": "2700", "t": "Statistics", "d": "math", "term": "Y", "cr": 1, "g": [12], "appr": "", "pre": "Algebra II or Dept. Rec.", "req": "2310|2330|2330PA", "fl": "", "note": "", "desc": "Statistics acquaints students with the major concepts and tools for collecting, analyzing, and drawing conclusions from data. Students will occasionally be working with projects that involve hands-on gathering and analysis of real-world data. Ideas and computations presented in this course have immediate links and connections with actual events. The class often utilizes computer and calculatorbased statistical programs, simulations, and manipulatives in a blended learning environment to enhance student understanding of the concepts involved in statistics.", "b": "Collect, analyze, and draw conclusions from real data, often through projects."}, {"id": "2780", "nums": "2780", "t": "AP Statistics", "d": "math", "term": "Y", "cr": 1, "g": [12], "appr": "", "pre": "Pre-Calculus H or Dept. Rec.", "req": "m>=4.6", "fl": "ap", "note": "", "desc": "Advanced Placement Statistics is offered to students who wish to complete studies equivalent to a one-semester, introductory, noncalculus-based college course in statistics. The purpose of the AP course in statistics is to introduce students to the major concepts and tools for collecting, analyzing, and drawing conclusions from data. Students are exposed to four broad conceptual themes: 1. Exploring Data: Describing patterns and departures from patterns 2. Sampling and Experimentation: Planning and conducting a study 3. Anticipating Patterns: Exploring random phenomena using probability 4. Statistical Inference: Estimating population parameters & testing hypothesis Students in this class are expected to take the AP Examination in May.", "b": "A college-level, non-calculus statistics course with an AP exam."}, {"id": "2810", "nums": "2810", "t": "Advanced Topics: Calculus II/III", "d": "math", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "AP Calculus AB, or AT: Analysis with a 4 or better on the AP AB exam with Dept. Rec.", "req": "2660|2610", "fl": "ap", "note": "", "desc": "In addition to reviewing topics from Calculus AB, with a heavier emphasis on theory, this course covers the topics delineated in the BC syllabus of the Advanced Placement Program and prepares students for the Calculus BC examination, given in May. Additional topics not included on the AP BC exam are discussed throughout the year, with an emphasis on differential equations after the exam. Students enrolled in this class are expected to take the AP Calculus BC Examination in May.", "b": "BC calculus with more theory, plus topics from Calculus III."}, {"id": "2863", "nums": "2863", "t": "Advanced Topics: Multivariable Calculus", "d": "math", "term": "S1", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Dept. Rec. (after AT: Calculus II/III)", "req": "2810", "fl": "ap alt0", "note": "", "desc": "This course is designed for exceptional students who have completed Advance Topics: Calculus II/III. Topics covered include vectors and the geometry of space; application of calculus to vector-valued functions, including motion in space, arc length and curvature; functions of several variables, including partial derivatives, gradients and tangent planes, optimization problems, and Lagrange Multipliers; double and triple integration, including with change of variables; and calculus of vectors fields culminating with the classic Theorems of Green, Stokes and the divergence Theorem. While this course covers topics more advanced than any Advanced Placement test, the goal is to prepare students, upon college matriculation, for either an honors version of this course, a college administered placement test into a more advanced course, or an excellent preparation for a course covering similar material.", "b": "Calculus in three dimensions: vectors, surfaces, and motion in space."}, {"id": "2864", "nums": "2864", "t": "Advanced Topics: Linear Algebra", "d": "math", "term": "S2", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Dept. Rec. (after AT: Calculus II/III)", "req": "2810", "fl": "ap alt0", "note": "", "desc": "This course is designed for exceptional students who have completed Advanced Topics: Calculus II/III. Topics covered include solving systems of linear equations using Gaussian row reduction of matrices, including how to express the solution set in parametric form; detailed study of vector spaces beginning from axioms and including discussion of linear independence, subspaces, basis, dimension, and the rank theorem; considering the matrix as a linear transformation of vector spaces which leads to a rigorous discussion of matrix operations like multiplication, inverse, and determinants. Finally, we discuss ways to analyze and categorize matrices using eigenvectors and similarity. As time permits, we discuss applications such as systems of linear differential equations. Throughout, a goal is to focus on writing about math with precision, and many exercises are proofbased. While this course covers topics more advanced than any Advanced Placement test, the goal is to prepare students, upon college matriculation, for either an honors version of this course, a college administered placement test into a more advanced course, or an excellent preparation for a course covering similar material.", "b": "Matrices, vector spaces, and solving systems of linear equations."}, {"id": "2881", "nums": "2881", "t": "Advanced Topics: Differential Equations", "d": "math", "term": "S1", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Dept. Rec. (after AT: Calculus II/III)", "req": "2810", "fl": "ap alt1", "note": "", "desc": "This course is designed for exceptional students who have completed Advanced Topics: Calculus II/III. We begin with a detailed study of Ordinary Differential Equations (ODE) including a categorization of 1st order equations with different solution techniques, existence and uniqueness theorems, and techniques for higher order linear equations including Laplace Transforms. An introduction to Partial Differential Equations contains a discussion of Fourier Series and an analysis of the famous heat, wave, and Laplace equations. As time permits, we will conclude the course with a discussion of the Calculus of Variations. While this course covers topics more advanced than any Advanced Placement test, the goal is to prepare students, upon college matriculation, for either an honors version of this course, a college administered placement test into a more advanced course, or an excellent preparation for a course covering similar material.", "b": "How to model and solve equations that describe change over time."}, {"id": "2882", "nums": "2882", "t": "Advanced Topics: Group Theory", "d": "math", "term": "S2", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Dept. Rec. (after AT: Calculus II/III)", "req": "2810", "fl": "ap alt1", "note": "", "desc": "This course is designed for exceptional students who have completed Advanced Topics: Calculus II/III. We begin with an inquiry-based study of the structure of finite groups including groups inspired by modular arithmetic, and geometric symmetries. We develop the language and tools of group theory including isomorphisms and homomorphisms, subgroups and quotient groups, normal subgroups, and the concept of a solvable group. We then shift to consider functions of a complex variable. Group theory is used to understand the Riemann surface of a function and the ultimate goal is to prove some famous theorems of Algebra: the Fundamental Theorem, and Abel’s Theorem of the impossibility of the quintic formula in radicals. Throughout, a goal is to focus on writing about math with precision, and many exercises are proof-based. While this course covers topics more advanced than any Advanced Placement test, the goal is to prepare students, upon college matriculation, for either an honors version of this course, a college administered placement test into a more advanced course, or an excellent preparation for a course covering similar material.", "b": "An inquiry-based look at the abstract structures behind symmetry and number."}, {"id": "2866", "nums": "2866-1 / 2866-2", "t": "Number Theory Through Programming", "d": "math", "term": "S", "cr": 0.5, "g": null, "appr": "", "pre": "Pre-Calculus H or Dept. Rec.", "req": "m>=4.6", "fl": "", "note": "", "desc": "This is a departmental crossover course intended to deepen student skills in both computer programming and mathematics. It will be a project-based course where students are challenged to answer a sequence of mathematical questions. A few may be possible to answer by hand, but we want to focus on problems that use efficient algorithm and data structure techniques that may also require learning some new math to figure out. Students will be expected to develop and approach their own research projects, generalizing the course material.", "b": "Answer math questions by writing code, building both skills at once."}, {"id": "3000", "nums": "3000", "t": "Latin I", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course uses stories set in ancient Pompei and Egypt to teach basic concepts of Latin grammar and to introduce students to the history, culture, and mythology of the Roman Empire. In addition to learning to analyze the word and sentence structure of Latin prose, the course also teaches students to recognize the Latin origins and meanings of English words. Daily assignments, quizzes, tests, semester and final examinations.", "b": "Beginning Latin through stories set in ancient Pompeii and Egypt."}, {"id": "3020", "nums": "3020", "t": "Latin II", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3000", "fl": "", "note": "", "desc": "This course continues to develop reading skills and knowledge of grammar and vocabulary through the study of stories covering the Roman conquest of Britain as well as the political intrigue surrounding the emperor in ancient Rome itself. Students gain a deeper understanding of Roman history, culture, and mythology, and continue to build their knowledge of English vocabulary derived from Latin. Daily assignments, quizzes, tests, semester and final examinations.", "b": "More Latin reading, from Rome's conquest of Britain to palace intrigue."}, {"id": "3030", "nums": "3030", "t": "Latin III: Language and Literature", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3020", "fl": "", "note": "", "desc": "The first half of this course completes the study of Latin grammar and forms while continuing to improve students' ability to read and translate Latin in preparation for the AP level of Latin. The second half of the course introduces students to ancient literature through Cicero's speeches and letters and the poetry of Ovid. Daily assignments, quizzes, tests, semester and final examinations.", "b": "Finishes Latin grammar, then starts reading real Roman authors."}, {"id": "3050", "nums": "3050", "t": "Latin IV: Literature", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3030", "fl": "", "note": "", "desc": "Students in this fourth-level course use their grammar and vocabulary skills from Latin I through Cicero and Ovid (Level III) to read and analyze new topics in Latin literature. Readings for the course include prose and poetry by Catullus, Horace, and other authors. The course helps students strengthen their reading and writing skills in preparation for AP Latin: Caesar and Vergil. Student performance is assessed through compositions, quizzes, tests, a midterm, and a final examination.", "b": "Reading and analyzing Latin prose and poetry by major Roman writers."}, {"id": "3070", "nums": "3070", "t": "Latin IVH: Literature", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3030", "fl": "h", "note": "", "desc": "Students enrolled in this class will gain a deeper understanding of different topics in Latin Literature using the grammar and vocabulary learned in previous levels. Honor students must complete 2 essays/projects per semester to expand on their knowledge of the authors, texts, or historical/cultural contexts or significance of the texts beyond what is being studied by regular Latin IV curriculum, and complete 2 Latin prose compositions projects per semester.", "b": "Honors Latin literature with extra essays and projects."}, {"id": "3080", "nums": "3080", "t": "AP Latin: Vergil & Pliny", "d": "wl", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3050|3070", "fl": "ap", "note": "", "desc": "The course prepares students for the Latin Advanced Placement Examination, which includes assigned passages from the letters of Pliny the Younger, from Vergil’s Aeneid, and from various passages chosen by the instructor each year from the AP approved list. Students must be able to translate, analyze, and learn the historical context for these passages. They must learn to scan Latin poetry in dactylic hexameter, and must learn to recognize rhetorical and literary devices common to Latin literature. As designated by the AP curriculum, study of assigned passages from English translations of the Aeneid are also required, as well as a designated body general knowledge about ancient Roman history and culture. Assessments include translation and comprehension tests and quizzes. All students are expected to submit a final AP project and complete the on-line AP examination in May.", "b": "Translate Vergil and Pliny to prepare for the AP Latin exam."}, {"id": "3100", "nums": "3100", "t": "French I", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "In this beginning course, which is taught mostly in French, students practice the fundamentals of the language through listening, repetition, speaking, reading, and writing activities. They are introduced to simple vocabulary, elementary grammatical structures, and the present and past tenses of common verbs. An understanding of Francophone culture is initiated. Projects, oral and written tests, semester and final examinations.", "b": "Beginning French, taught mostly in French, with everyday vocabulary."}, {"id": "3120", "nums": "3120", "t": "French II", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3100", "fl": "", "note": "", "desc": "This course is taught in French and involves a review and extension of the principles and material presented in French I. Students develop and strengthen their ability to think and express ideas and opinions in French. They refine their reading and listening comprehension skills and further develop their speaking and written expression. In addition, key aspects of Francophone culture are discussed. Projects, oral and written tests, semester and final examinations.", "b": "Build on French I and learn to share ideas and opinions in French."}, {"id": "3140", "nums": "3140", "t": "French III", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3120", "fl": "", "note": "", "desc": "This course further develops the speaking, listening, reading, writing, and culture proficiencies acquired in French I and II. Major emphasis is placed on increasing comprehension and comprehensibility by refining writing skills, reviewing grammatical concepts, and introducing more complex structures and a wider variety of vocabulary. Students’ knowledge of Francophone cultures and civilizations is further expanded. Classes are taught in French, and students participate actively in role-playing activities, oral presentations, and frequent written and pronunciation exercises. Projects, oral and written tests, semester and final examination.", "b": "Sharper speaking, writing, and reading skills in French."}, {"id": "3160", "nums": "3160", "t": "French IV", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3140", "fl": "", "note": "", "desc": "French IV is a continuation of the first three years of French language and cultural study. It provides a thorough review of material from French I – III while exposing students to more detailed vocabulary and more complex sentence structures. In addition, it engages students in more sophisticated discussions of Francophone culture. The students improve their oral and written proficiency skills through frequent in-class interactions, presentations, and cultural projects. In order to enhance their communicative skills, students become familiar with a wide range of authentic French materials including Internet sites, news reports and broadcasts, music, and film. Speaking, reading, and listening-comprehension assessments, grammar review exams, projects, oral and written tests, semester and final examination.", "b": "Reviews French I–III and adds richer vocabulary and sentence structure."}, {"id": "3170", "nums": "3170", "t": "French VH", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3140|3160", "fl": "h", "note": "", "desc": "This class is conducted exclusively in the target language to provide students with maximum exposure to French. The course is designed for students intending to take the Advanced Placement French Language and Culture class. Culturally authentic materials, texts, video clips, songs, articles on current issues, and internet sources are presented and lead to an in-depth study of Francophone culture. Class discussions followed by student-to-student interaction and conversation increase oral proficiency as well as cultural awareness. Basic grammatical structures are reviewed while new and complex concepts are introduced to broaden students’ oral and written expression. Performance in the language is regularly assessed using a variety of tools: compositions, projects, online oral and written responses to prompts, presentations, quizzes, tests and semester exams. Enrollment in this class is by departmental recommendation only.", "b": "An all-French honors course that prepares you for AP French."}, {"id": "3180", "nums": "3180", "t": "AP French Language and Culture", "d": "wl", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3170", "fl": "ap", "note": "", "desc": "This course is conducted entirely in French and is designed to prepare students for the College Board Advanced Placement French Language and Culture examination. By this level, students have acquired a good command of French grammar and a considerable competence in listening, speaking, reading and writing as well as a broad cultural awareness of Francophone culture. Students will increase their ability to understand how French is spoken in different parts of the world in both formal and informal conversational situations. They will develop a knowledge of idioms, sophisticated vocabulary, and discourse techniques. Multimedia resources will be analyzed and discussed. Students will comfortably express opinions and ideas about current events, internet articles, videos, documentaries, film excerpts, and commercials. Emphasis is placed on becoming fluent speakers, readers, and writers of French while absorbing relevant thematic information from the Francophone world. Enrollment in this course is by departmental recommendation. All students take the AP exam in May.", "b": "An all-French course that prepares you for the AP French exam."}, {"id": "3300", "nums": "3300", "t": "Spanish I", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "The objective of this course is to establish a foundation in elementary Spanish in the four language skills (listening, speaking, reading and writing). Students learn to use the language meaningfully and begin to develop the facility to communicate in the context of the Spanish-speaking world. Grammar and vocabulary are taught in terms of function and application to real-life situations. Very little English is used in class and students are encouraged to use Spanish as much as possible. Students listen to audio recordings by native speakers, participate in daily speaking and listening activities, and write simple, guided compositions. All four skills are tested regularly during the year.", "b": "Beginning Spanish in listening, speaking, reading, and writing."}, {"id": "3320", "nums": "3320", "t": "Spanish II", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3300", "fl": "", "note": "", "desc": "This course involves a review and extension of the principles and material taught in Spanish I. Emphasis is placed on the refinement of reading and listening skills, greater development of writing skills, and a continued study of key aspects of Hispanic life and cultures. Students are introduced to new grammatical concepts and verb tenses, with a focus on the preterit and imperfect past tenses. Classes are taught almost exclusively in Spanish and an on-going effort is made to develop students’ ability to express ideas in Spanish and to think in the target language. As in Spanish I, all four skills are tested regularly during the year.", "b": "Builds on Spanish I with more reading, writing, and grammar."}, {"id": "3340", "nums": "3340", "t": "Spanish III", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3320", "fl": "", "note": "", "desc": "This course further develops the listening, speaking, reading, and writing skills acquired in Spanish I and II. Major emphasis is placed upon developing comprehension and comprehensibility by refining writing skills, reviewing previously acquired grammatical concepts, and introducing more complex structures. Particular focus is given to the subjunctive and the imperative moods. Readings include excerpts from Spanish literature as well as current online journalism. Classes are taught in Spanish and students participate in daily speaking and listening activities. As in the previous Spanish courses, all four skills are tested regularly during the year.", "b": "Stronger speaking and writing skills in Spanish."}, {"id": "3360", "nums": "3360", "t": "Spanish IV", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3340", "fl": "", "note": "", "desc": "This course, conducted in Spanish, provides a comprehensive review of the material presented in the first three years while introducing students to more advanced verbal and grammatical structures. Students read and respond to texts in a variety of genres, including fiction, drama, poetry, journalism, as well as readings on Hispanic culture and history, popular and folk music, and Spanishlanguage films. They develop active vocabulary and proficiency in listening, speaking, and writing through class conversations, oral presentations, impromptu writing, and speaking exercises. Students use Spanish Internet sites, radio broadcasts, and online journalism. All four skills are tested regularly throughout the year.", "b": "Reviews Spanish I–III and adds advanced grammar, taught in Spanish."}, {"id": "3370", "nums": "3370", "t": "Spanish VH", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3340|3360", "fl": "h", "note": "", "desc": "This advanced course is conducted entirely in Spanish and is designed for students intending to take the Advanced Placement Spanish Language and Culture course. It provides a thorough study of the more complex aspects of Spanish grammar and is based on reading in a variety of genres, including fiction, poetry, journalism, readings on Hispanic culture and history, popular and folk music. Students develop active vocabulary and proficiency in listening, speaking, and writing through class discussions, oral presentations, impromptu writing, and speaking exercises. Students become familiar with the AP exam format and work with a range of authentic materials, including Spanish Internet sites, radio broadcasts, online journalism, and contemporary Spanish-language cinema. All four skills are tested regularly throughout the year. Enrollment in this class is by departmental recommendation.", "b": "An all-Spanish honors course that prepares you for AP Spanish."}, {"id": "3380", "nums": "3380", "t": "AP Spanish Language and Culture", "d": "wl", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3370", "fl": "ap", "note": "", "desc": "This advanced course is conducted exclusively in Spanish and is designed to prepare students for the College Board Advanced Placement Spanish Language and Culture Examination. Students develop language proficiency across the three modes of communications –interpretive, interpersonal, and presentationaland learn about culture through the use of authentic materials that are relevant to the Spanish-speaking world. The main focus is to refine and integrate all four skills through informal conversations and impromptu dialogues, as well as through formal written and oral presentations. Reading and listening include a variety of resources, including journalistic and literary works, podcasts, interviews, charts, music, and film. Enrollment in this class is by departmental recommendation. All students take the AP exam in May.", "b": "An all-Spanish course that prepares you for the AP Spanish exam."}, {"id": "3400", "nums": "3400", "t": "Chinese I", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This introductory course in standard Chinese (Mandarin) is proficiency-based and develops a foundation in four basic language skills: aural comprehension, speaking, reading, and writing. The course objectives are to enable students 1) to converse using common expressions, 2) to read and write simple sentences, and 3) to gain a general overview of Chinese culture. Classes use lectures and simulated activities from daily life to teach major sentence structures, pinyin and characters (simplified and traditional), and to develop pronunciation, tones, and conversational skills. Classes are enhanced with presentations, games, movies, and festival celebrations. The course evaluates the four language skills throughout the year and uses Communicating in Chinese as the primary text. Students are highly encouraged to join the Sino Club and maintain their participation throughout their years of Chinese study.", "b": "Beginning Mandarin Chinese: speaking, listening, reading, and writing."}, {"id": "3420", "nums": "3420", "t": "Chinese II", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3400", "fl": "", "note": "", "desc": "This course builds upon the foundation of Chinese I and asks students to go beyond the basic level in each of the four language skills. Students participate in conversations in a variety of everyday contexts and increase their listening skills through class discussions and a variety of audio-visual materials and exercises. Students read and write sentences, both in pinyin and Chinese characters, using broader vocabulary and more complex sentence structure. Students also learn more about popular beliefs and customs in traditional and contemporary Chinese culture. As in Chinese I, all four skills are tested throughout the year.", "b": "Builds on Chinese I with everyday conversations and more characters."}, {"id": "3440", "nums": "3440", "t": "Chinese III", "d": "wl", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3420", "fl": "", "note": "", "desc": "This course is conducted mostly in Chinese and further develops the skills acquired in Chinese II. This course is designed to increase the students’ proficiency in all four skill areas through class discussions, role-play activities, oral presentations, and frequent written exercises. Students are introduced to a broader and more complex range of textual material in order to expand their reading and writing skills. Students make use of both pinyin and Chinese characters in order to write about their daily activities, as well as those common to contemporary Chinese culture. Students improve their listening skills through the use of audio-visual material, Internet sites, and contemporary Chinese cinema. All four skills are tested throughout the year.", "b": "Taught mostly in Chinese, with discussions and role-play."}, {"id": "3460", "nums": "3460", "t": "Chinese IV", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3440", "fl": "", "note": "", "desc": "This course expands upon Chinese III and challenges the students to continue to strengthen their spoken skills while developing their reading and writing proficiency. This course will enable students 1) to increase the fluency, complexity, and range of their conversational Chinese; 2) to increase reading and writing proficiency using Chinese characters; and 3) to acquire a better understanding of Chinese social issues and an appreciation of Chinese culture and philosophy. The course is taught almost entirely in Chinese and makes use of such authentic Chinese materials as short stories, proverbs, plays, and songs, as well as contemporary Chinese cinema. All four skills – reading, writing, speaking, and listening – are tested throughout the year.", "b": "Stronger speaking plus more reading and writing in Chinese."}, {"id": "3470", "nums": "3470", "t": "Chinese IVH", "d": "wl", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3440", "fl": "h", "note": "", "desc": "This class provides students in Chinese with the tools to achieve intermediate-high proficiency in reading, writing, speaking, and listening. Unlike students in regular Chinese IV, honor students are required to memorize the characters and use them in different assessments. Students in Honors will also write in characters one of the essays and one of the story narrations. Students are expected to use the characters they have learned in the past 4 years and know about 1200 from memory by the end of the school year. The cumulative exams include listening, reading, and writing parts from Chinese I through Chinese IV, focusing on the topics of level 4. Students should be able to memorize all the idioms they have learned and compose a story with idiomatic expressions in character writing. Enrollment in this class is by departmental recommendation.", "b": "Honors Chinese with more character memorization and higher proficiency goals."}, {"id": "3480", "nums": "3480", "t": "AP Chinese Language", "d": "wl", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "3460|3470", "fl": "ap", "note": "", "desc": "This course is conducted entirely in Chinese and is designed for students intending to take the College Board Advanced Placement Chinese Language Exam. The goal of this course is to further develop their proficiency skills and to develop their awareness and appreciation of the culture of Chinese-speaking societies. This course is comparable to third or fourth semester university courses in Mandarin Chinese. The students are expected to perform intermediate to advanced-level tasks in listening, reading, speaking, and writing. The course strives to increase students’ ability in comprehending spoken Chinese both in formal and conversational situations, to develop vocabulary for reading newspapers and magazine articles, and to sharpen their presentational skills in oral and written form. Formative assessment of students’ proficiencies in listening, speaking, reading, and writing are given on a regular basis. Instructional materials and activities are strategically adapted from authentic resources to support the linguistic and cultural goals of this course. Enrollment in the course is by departmental recommendation. All students take the AP exam.", "b": "An all-Chinese course that prepares you for the AP Chinese exam."}, {"id": "4110", "nums": "4110", "t": "Biology I", "d": "sci", "term": "Y", "cr": 1, "g": [9], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Biology I is an introductory course designed to explore the nature of the physical world as it relates to the living. This course will focus on the diversity of organisms from their chemical constituents through their ecological roles. Emphasis is placed on laboratory exercises that promote problem-solving, refine laboratory procedures, and strengthen reading, writing, and math skills. Students will participate in outdoor field studies and be encouraged towards the exploration of personal avenues of interest in science. Topics include anatomy, cellular biology, energetics, genetics, ecology, and evolution.", "b": "An introduction to life science, from cells to ecosystems."}, {"id": "4120", "nums": "4120", "t": "Biology IH", "d": "sci", "term": "Y", "cr": 1, "g": [9], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "h", "note": "", "desc": "Biology IH is an accelerated first-year biology course with a focus on evolution and molecular biology. Students cultivate their understanding of biology through inquiry-based investigations as they explore the following topics: natural selection, cell structure and function, energetics, genetics, biochemistry, molecular biology of the gene, and ecology. Laboratory investigations require students to ask questions, make observations and predictions, design experiments, analyze data, and construct arguments in a collaborative setting.", "b": "An accelerated biology course focused on evolution and molecular biology."}, {"id": "4150", "nums": "4150", "t": "Marine Biology", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "", "pre": "Bio I, Chem I or Dept. Rec.", "req": "BIO;CHEM", "fl": "", "note": "", "desc": "This lab-oriented course delves into the diverse habitats found in aquatic environments, including the Great Lakes, coral reefs, and the deep sea. Students will examine the chemical and physical properties that shape marine ecosystems and explore the impact of human activity on ocean life. The curriculum provides a foundation in marine ecology, oceanography, and conservation, combining lectures, hands-on experiments, dissections, and field studies to create an engaging and comprehensive learning experience. Students will be assessed with assignments, dissections, exams, and projects.", "b": "A lab course on ocean and Great Lakes life and habitats."}, {"id": "4180", "nums": "4180", "t": "AP Biology", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Chemistry IH and Dept. Rec.", "req": "4220", "fl": "ap", "note": "", "desc": "AP Biology is a college-level biology course for majors. Students cultivate their understanding of biology through inquiry-based investigations as they explore the following topics: evolution, cellular processes, energy and communication, genetics, information transfer, ecology, and int
