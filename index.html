eractions. This course is aligned to the College Board AP Biology Curriculum Framework and is based on four Big Ideas, which encompass core scientific principles, theories, and processes that cut across traditional boundaries and provide a broad way of thinking about biological systems. Twenty-five percent of instructional time is devoted to hands-on laboratory work with an emphasis on inquiry-based investigations. Investigations require students to ask questions, make observations and prediction, design experiments, analyze data, and construct arguments in a collaborative setting.", "b": "College-level biology with inquiry labs, preparing for the AP exam."}, {"id": "4200", "nums": "4200", "t": "Conceptual Chemistry", "d": "sci", "term": "Y", "cr": 1, "g": [10, 11], "appr": "Dept. Rec.", "pre": "Algebra II Essentials and Dept. Rec.", "req": "m>=3~", "fl": "", "note": "", "desc": "Ozone depletion, energy demands, climate change, water supply, plastics, and genetic engineering are real world issues that will be viewed through the lens of chemistry and examined in a framework intended to engage student critical thinking. Classroom lectures and activities as well as lab experiences will illustrate how conflicting answers to these big questions might arise from similar experimental results.", "b": "Chemistry through real issues like climate change, water, and plastics."}, {"id": "4210", "nums": "4210", "t": "Chemistry I", "d": "sci", "term": "Y", "cr": 1, "g": [10, 11], "appr": "Dept. Rec.", "pre": "Biology I and Dept. Rec.", "req": "BIO", "fl": "", "note": "", "desc": "This course concerns itself with the chemical and physical properties of matter, both qualitatively and quantitatively. In the classroom, problem solving, and visualization of abstract chemical concepts are emphasized. In the laboratory, careful measurement and observation is practiced through methods of work and lab report writing.", "b": "Properties of matter and chemical reactions, with plenty of lab work."}, {"id": "4220", "nums": "4220", "t": "Chemistry IH", "d": "sci", "term": "Y", "cr": 1, "g": [10, 11], "appr": "Dept. Rec.", "pre": "Biology, Algebra II concurrently and Dept. Rec.", "req": "BIO;m>=3~", "fl": "h", "note": "", "desc": "Placement is based on previous grades in science and mathematics, standardized test scores, and teacher recommendations. The course will cover all the topics of Chemistry I, but in greater depth and at a faster pace. It will also include an introduction to Organic Chemistry.", "b": "Honors chemistry: all of Chemistry I, deeper and faster."}, {"id": "4280", "nums": "4280", "t": "AP Chemistry", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Pre-Calculus H or above and Dept. Rec.", "req": "CHEM;m>=4.6~", "fl": "ap", "note": "", "desc": "This course is designed to be the equivalent of the general chemistry course usually taken during the first college year. Fundamental topics are covered in greater depth, with more emphasis on chemical calculations and the mathematical formulation of principles. Laboratory work is more independent with frequent use of instrumentation and equipment, and organic laboratory techniques are introduced. Students enrolled in this course are expected to take the Advanced Placement Examination in May.", "b": "Equivalent to a first-year college chemistry course, with an AP exam."}, {"id": "4310", "nums": "4310", "t": "Physics I", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Biology, Chemistry, Pre-Calculus Essentials, and Dept. Rec.", "req": "BIO;CHEM;m>=4~", "fl": "phys", "note": "", "desc": "Physics 1 is a course in classical physics, intended to develop the student’s inductive, deductive, and abstract reasoning. The course considers primarily Newtonian Mechanics. In the classroom this is accomplished thorough qualitative understanding of the concepts followed by rigorous, quantitative problem solving. In the laboratory this is accomplished through many college level laboratory experiments, which serve to test the relationships postulated in class. The entering student should be at ease with algebra and basic trigonometry. Physics I and Physics IH and are parallel courses; therefore, enrollment in one precludes enrollment in the other.", "b": "Classical physics, mainly forces and motion, with hands-on labs."}, {"id": "4320", "nums": "4320", "t": "Physics IH", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Biology, Chemistry, Pre-Calculus and Dept. Rec.", "req": "BIO;CHEM;m>=4.2~", "fl": "h phys", "note": "", "desc": "Physics 1 Honors is an algebra-based rigorous introduction to the concepts and methods of physics. In addition to mechanics and electromagnetism, this course incorporates topics from astrophysics, optics, particle physics or solid-state physics. Frequent laboratory experiences will enhance the curriculum including projects that encourage exploration of topics in greater depth. The workload in this course is substantial and the ability to work both independently and in teams is assumed. Physics I and Physics IH and are parallel courses; therefore, enrollment in one precludes enrollment in the other.", "b": "Rigorous algebra-based physics, from mechanics to astrophysics."}, {"id": "4380", "nums": "4380", "t": "AP Physics C: Mechanics", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Biology, Chemistry, Calculus or above concurrently and Dept. Rec.", "req": "BIO;CHEM;m>=5~", "fl": "ap phys", "note": "", "desc": "This course is intended for the highly motivated student with a strong mathematical background and interest in science. Primary activities are problem solving and lab investigations. The homework load is substantial and the ability to work independently is assumed. Basic calculus will be introduced and used as students become familiar with both the science and the math. Students enrolled in this course are expected to take the AP C Mechanics Examination in May.", "b": "Calculus-based mechanics for students with strong math skills."}, {"id": "4390", "nums": "4390", "t": "AP Physics C: Electricity and Magnetism", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Biology, Chemistry, AP Calculus AB or above concurrently and Dept. Rec.", "req": "BIO;CHEM;m>=5.5~", "fl": "ap phys", "note": "", "desc": "Nature’s four fundamental forces, electricity and magnetism (E&M) and the two nuclear forces, act in concert and at a distance. If one is to understand the most fundamental ideas of forces between objects, then understanding the relationship between E&M and their place in our current views of the universe is necessary. This course will be taught through lectures, experiments, collaborative problem-solving sessions, and tests. Students enrolled in this course are expected to take the AP C: E&M Examination in May.", "b": "Calculus-based electricity and magnetism, with an AP exam."}, {"id": "4410", "nums": "4410", "t": "Advanced Topics: Scientific Research", "d": "sci", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Dept. Rec.", "req": "", "fl": "ap", "note": "", "desc": "In the first semester, the class will cover how to choose research questions, complete effective literature reviews, and design experiments. Our discussions will include ethics in scientific research, tools for data collection, effective data analysis, and best practices for communication of findings. After being introduced to methods and advanced research skills, students will choose a topic of interest to develop an independent research project during the second semester. This interdisciplinary course will encourage students to demonstrate critical thinking in experimental design, observation, data collection, data analysis, and communication skills as we will end the year by presenting projects to an audience.", "b": "Design and carry out your own scientific research project."}, {"id": "4515", "nums": "4515", "t": "Environmental Science: Systems", "d": "sci", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I, Chem concurrent", "req": "BIO;CHEM~", "fl": "", "note": "", "desc": "The Earth’s biosphere, atmosphere, hydrosphere, and geosphere operate as complex, linked systems. When left to their own devices, these systems would establish unchanging equilibriums persisting throughout time. The reality is that various system components are exchanged and change over greatly varying time scales. This course introduces students to environmental, earth, living, and energy systems and their relationship to the biosphere. Environmental Science: Systems includes a significant laboratory and field investigation component. Assessments also include lab reports, presentations, group work, homework, tests, and a semester exam.", "b": "How Earth's air, water, land, and life work as linked systems."}, {"id": "4505", "nums": "4505", "t": "Planetary Astronomy", "d": "sci", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I", "req": "BIO", "fl": "", "note": "", "desc": "This course is dedicated to the study of objects within the solar system, including the Sun, planets, moons, minor planets, and comets. Students will be introduced to the observational basis for our understanding of the movements of solar system objects. Regular observations of the night sky will be required. Current data from space probes will be used to understand the surface and interior conditions of solar system objects. Weekly lab exercises will reinforce lecture material. A final project has the students creating and presenting a plausible planetary system.", "b": "The Sun, planets, moons, and comets of our solar system."}, {"id": "4517", "nums": "4517", "t": "Anatomy", "d": "sci", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I", "req": "BIO", "fl": "", "note": "", "desc": "The scope of this course extends beyond the human anatomy and physiology studied in Biology I. Classroom lectures and discussions concentrate on the systems of the human body. In the twice-weekly laboratory exercises, students primarily study comparative anatomy. By means of dissection, students examine the evolutionary paths taken by different animals and acquire an appreciation for the diversity of life forms.", "b": "The human body's systems, plus labs comparing animal anatomy through dissection."}, {"id": "4618", "nums": "4618", "t": "Physiology", "d": "sci", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I", "req": "BIO", "fl": "", "note": "", "desc": "This course extends both the breadth and depth of physiology studied in first year Biology. Classroom lectures and discussions concentrate on the nervous, respiratory, digestive, and reproductive systems with a focus on the physical and chemical processes of each system. Laboratory work will be primary experimental focus in the course with three major dissections.", "b": "How the body's nervous, respiratory, and digestive systems work."}, {"id": "4616", "nums": "4616", "t": "Environmental Science: The Human Element", "d": "sci", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I, Chem concurrent", "req": "BIO;CHEM~", "fl": "", "note": "", "desc": "The earth is a biosphere of abundance that at one time was seen as a resource for all human needs. A soaring human population, however, has reduced the earth’s size, making it smaller than anyone ever anticipated. How do humans interact with and affect the atmosphere, biosphere, hydrosphere, and lithosphere? To be good stewards of this planet, the next generation of scientists and policy makers must have an understanding of population, land and water use, pollution, and global change. Environmental Science: The Human Element includes significant laboratory and field investigation components. Assessments also include lab reports, presentations, group work, homework, tests, and a semester exam.", "b": "How human activity affects the planet, and what we can do about it."}, {"id": "4606", "nums": "4606", "t": "Stellar Astronomy", "d": "sci", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Biology I", "req": "BIO", "fl": "", "note": "", "desc": "This course offers an understanding of Astronomy from the standpoint of stars, systems of stars, and the environment between stars. Stellar evolution is studied in detail, as is the Milky Way galaxy, other galaxies, and the universe as a whole. Weekly lab exercises reinforce lecture material. This course is not necessarily intended to be a continuation of Planetary Astronomy and may be taken independently.", "b": "Stars, galaxies, and the universe beyond our solar system."}, {"id": "4519", "nums": "4519 / 4622", "t": "The Chemistry of Food", "d": "sci", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Imagine taking a bite of a delicious Honey Crisp Apple. Did you know that the chemistry behind changing the red, moist, fragrant, and sweet fruit from food to fuel begins in your mouth while chewing? Imagine placing a slice of whole wheat bread into a toaster – did you consider that the breads’ color change while becoming toast is a chemical reaction? These ideas and more will be considered through cooking, tasting, and learning the role that carbohydrates, lipids, proteins, and more play in the creation of food dishes as well as their role and effect on our bodies. The course applies basic scientific principles to food systems and practical applications. Reactions, conditions, and processes that affect color, flavor, texture, nutrition, and safety of food are emphasized. Classroom work and significant lab work will comprise the method of learning the chemistry of food.", "b": "The chemistry of food, explored by cooking and tasting."}, {"id": "9801", "nums": "9801 / 9802", "t": "Health", "d": "health", "term": "S", "cr": 0.25, "g": [9], "appr": "", "pre": "", "req": "", "fl": "", "note": "Required for freshmen.", "desc": "This required course for freshmen provides the opportunity to acquire insights and information that can help form sound choices and the development of personal values on matters of mind and body. Relevant topics including physical health assessment, the importance of exercise, sleep and nutrition, maintaining emotional balance, strengthening interpersonal relationships and understanding behaviors such as smoking, drinking, drugs and sexual activity will be explored as they pertain to the teenager emerging into young adulthood. The instructional format will allow for interactive discussions, presentations by knowledgeable speakers and the support of appropriate audio-visual and printed materials. Occasional short readings and surveys of opinion will occur. Students are evaluated on three major projects: participating in a lifetime fitness activity done outside of class, presenting a group project, and arranging a guest speaker for the class. Students are also expected to prepare and participate in physical activity days and in class discussions. Quizzes are also occasionally administered on the material learned in class.", "b": "Required freshman course on making healthy choices for mind and body."}, {"id": "5110", "nums": "5110", "t": "Worldviews and Civilizations", "d": "hist", "term": "Y", "cr": 1, "g": [9], "appr": "", "pre": "", "req": "", "fl": "", "note": "Shared by History and Religion & Philosophy; counted here as 1/2 credit toward each.", "desc": "This course, drawing on the strengths and interests of the departments of History/Social Science and Religion & Philosophy, provides a concrete and conceptual foundation for the study of human societies. Through an interdisciplinary study of several of the most significant world-shaping civilizations across time, students learn to ask, and to begin to answer, fundamental questions of humanity. From the Ancient Near East and the Indus Valley to China, Greece, Rome, and the legacies of Hinduism, Buddhism, Judaism, Christianity, and Islam, students study and discuss the systems of government, culture, and faith which continue to provide humanity with its view of its place in the world. Assessment is made through quizzes, tests, essays, research projects, and semester examinations.", "b": "Freshman history and religion course on how human societies and beliefs developed."}, {"id": "5210", "nums": "5210", "t": "World History: Intersections Past and Present", "d": "hist", "term": "Y", "cr": 1, "g": [10], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Knowledge of the past allows students to understand the present, examine their own beliefs and to develop an understanding of those different from themselves. The themes of connections and progress guide this course as students examine important developments in world history from 1200 CE to the present. While training students in critical reading, speaking, and writing, this curriculum provides a historical perspective on the problems of the contemporary world. Students develop research and writing skills throughout the course, culminating in an independent research paper. They also develop test taking skills, engage in collaborative and digital projects, and learn media literacy skills.", "b": "World history through connections between past and present."}, {"id": "5470", "nums": "5470", "t": "AP World History: Modern", "d": "hist", "term": "Y", "cr": 1, "g": [10], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "In AP World History: Modern, students investigate significant events, individuals, developments, and processes from 1200 C.E. to the present. Students develop and use the same skills, practices, and methods employed by historians: analyzing primary and secondary sources; developing historical arguments; making historical connections; and utilizing reasoning about comparison, causation, and continuity and change over time. The course provides six themes that students explore throughout the course in order to make connections among historical developments in different times and places: humans and the environment, cultural developments and interactions, governance, economic systems, social interactions and organization, and technology and innovation. Students take the College Board Advanced Placement Examination in May for advanced college standing.", "b": "College-level world history from 1200 to today, with an AP exam."}, {"id": "5310", "nums": "5310", "t": "American History and Government (AS)", "d": "hist", "term": "Y", "cr": 1, "g": [11], "appr": "", "pre": "", "req": "", "fl": "as", "note": "", "desc": "American History and Government focuses on the American experience from first contacts to the present in order to provide students with an understanding of the development of society, government, and America's place in the world. Various units highlight the multicultural colonial experience, evolution of republican forms of government, foundations of racial relations, industrialization, immigration and urbanization, the 20th Century, the Cold War, and beyond. Students learn to read, analyze, and critique historical material. They are introduced to different methodologies and learn to weigh historical evidence. Various assessments are utilized including quizzes, oral presentations and classroom projects, multiple choice and essay tests, and research projects.", "b": "The American story from first contact to today, plus how government works."}, {"id": "5380", "nums": "5380", "t": "AP United States History (AS)", "d": "hist", "term": "Y", "cr": 1, "g": [11], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap as", "note": "", "desc": "Equivalent to an introductory college course, this course analyzes a variety of political, economic, social, cultural, and international themes. It provides students with a thorough background in factual material, but proceeds to an examination of context, cause, result, and significance. Students learn to read historical material analytically and critically and are able to weigh historical evidence soundly. A college text is used, as well as a wide variety of materials. Students take the College Board Advanced Placement Examination in May for advanced college standing.", "b": "College-level U.S. history that fulfills the American Studies requirement."}, {"id": "5480", "nums": "5480", "t": "AP European History", "d": "hist", "term": "Y", "cr": 1, "g": [12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "This course surveys the development of Europe from the early Renaissance to the early twenty-first century, c. 1450 to the present. In accordance with the College Board’s Course Description in European History, the course instruction emphasizes seven core themes of this period: the interaction of Europe and the world; poverty and prosperity; objective knowledge and subjective visions; states and other institutions of power; the individual and society; technological and scientific innovation; and national and European identity. Varying interpretations of historical events are examined at every stage. In addition to a college-level core text, students analyze a wide array of written and audio-visual resources such as primary source readings, music, works of art, maps, charts, and graphs. Daily guided discussion focuses on major themes and questions, emphasizing consistent preparation and direct student participation. Written work consists of papers and essays, both free-response and document-based, closely fashioned and scored on the model of the AP Exam. These assessments prepare students for the Advanced Placement Examination in May, which students in the course are expected to take for advanced college credit.", "b": "European history from the Renaissance to today, with an AP exam."}, {"id": "5490", "nums": "5490", "t": "AP African American Studies", "d": "hist", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "AP African American Studies offers an in-depth, interdisciplinary introduction to the experiences that have shaped African American people from the beginnings of the African diaspora to the present. Students are introduced to a range of primary and secondary sources that will give them multiple angles from which to explore the central themes of the course. In keeping with the course’s interdisciplinary nature, traditional historical sources will be explored alongside poetic, literary, musical, and cinematic documents. Students are expected to take the College Board AP exam in African American Studies, part of which will include a four-week research project in the spring semester on a topic selected in consultation with the instructor.", "b": "African American history and culture, with an AP exam."}, {"id": "5503", "nums": "5503 / 5604", "t": "Principles of Psychology", "d": "hist", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course introduces the fundamental concepts and theories of psychology. Topics covered may include learning theory, intelligence, development, memory, personality, and psychological adjustment. These theories and concepts are reinforced with a series of laboratory experiments. Discussions, lectures, exams, papers, research projects, and supplemental readings will be used.", "b": "An introduction to how people learn, remember, grow, and think."}, {"id": "5644", "nums": "5644", "t": "Macroeconomics", "d": "hist", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Economics may best be understood as a study of how individuals and societies make decisions. Macroeconomics in particular focuses on how national (as well as international and global) economies and their participants: households, firms, and governments interact in aggregate. Students will study the theoretical principles of economics, the role of government in regulating domestic and international markets, common metrics of economic activity, the Western model of financial and monetary systems, and the principle analytical models for understanding the health and trajectory of “open” economies. In the process, students will engage with a diverse array of primary-source theory and applied work from economists across American society and around the world. This emphasis on attaching applied and theoretical economics to authorship is intended to help students better understand the contributions of various peoples across time and space, and how their circumstances and experiences have helped to shape a shared understanding of the material world vis a vis Economics. The curation of course content has been informed by the Voluntary National Content Standards in Economics and a survey of “first-year” economics curricula at several well-known university economics programs. The course will culminate in an independent research unit, in which students will extend their knowledge of macroeconomics in an area of their choice (i.e. modern portfolio theory, foreign exchange markets, fiscal policy, trad/regulatory policy, monetary policy, or other).", "b": "How national and global economies work: growth, inflation, and policy."}, {"id": "5653", "nums": "5653", "t": "AP Macroeconomics", "d": "hist", "term": "S2", "cr": 0.5, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "AP Macroeconomics instructs students in relevant introductory-level economic theory, and the creation, interpretation, and application of proper macroeconomic models and graphs. Successful completion of all course components should result in students being prepared to complete the Advanced Placement Exam in macroeconomics in the spring. In particular, students will study how national (as well as international and global) economies and their participants: households, firms, and governments interact in aggregate. Students will study the theoretical principles of economics, the role of government in regulating domestic and international markets, common metrics of economic activity, the Western model of financial and monetary systems, and the principle analytical models for understanding the health and trajectory of “open” economies. In the process, students will engage with a diverse array of primarysource theory and applied work from economists across American society and around the world. The course will culminate in an independent research unit, in which students will extend their knowledge of macroeconomics in an area of their choice (i.e. modern portfolio theory, foreign exchange markets, fiscal policy, trade/regulatory policy, monetary policy, or other). Students take the College Board Advanced Placement Examination in May for advanced college standing.", "b": "College-level macroeconomics with models and graphs, plus an AP exam."}, {"id": "5543", "nums": "5543", "t": "Microeconomics", "d": "hist", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Economics may best be understood as a study of how individuals and societies make decisions. Microeconomics in particular focuses on how individuals, firms, and government interact. Students will study the theoretical principles of economics, the role of government in regulating domestic markets, economic theories on non-private goods, industrial organization (structures from competitive to monopolistic), and labor economics. In the process, students will engage with a diverse array of primary-source theory and applied work from economists across American society and around the world. This emphasis on attaching applied and theoretical economics to authorship is intended to help students better understand the contributions of various peoples across time and space, and how their circumstances and experiences have helped to shape a shared understanding of the material world vis a vis Economics. The curation of course content has been informed by the Voluntary National Content Standards in Economics and a survey of “first-year” economics curricula at several well-known university economics programs. The course will culminate in an independent research unit, in which students will extend their knowledge of microeconomics in an area of their choice (i.e. applications of game theory, market structure analysis, policy analysis, etc.).", "b": "How people, businesses, and government make economic decisions."}, {"id": "5547", "nums": "5547", "t": "AP Microeconomics", "d": "hist", "term": "S1", "cr": 0.5, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "AP Microeconomics instructs students in relevant introductory-level economic theory, and the creation, interpretation, and application of proper microeconomic models and graphs. Successful completion of all course components should result in students being prepared to complete the Advanced Placement Exam in microeconomics in the spring. In particular, students will study how individuals, firms, and government interact. Students will study the theoretical principles of economics, the role of government in regulating domestic markets, economic theories on non-private goods, industrial organization (structures from competitive to monopolistic), and labor economics. The course will culminate in an independent research unit, in which students will extend their knowledge of microeconomics in an area of their choice (i.e. applications of game theory, market structure analysis, policy analysis, etc.). Students take the College Board Advanced Placement Examination in May for advanced college standing.", "b": "College-level microeconomics with models and graphs, plus an AP exam."}, {"id": "5533", "nums": "5533 / 5634", "t": "The Rise of Nazi Germany and the Holocaust", "d": "hist", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "How could Hitler and the Nazi Party achieve power in such a highly advanced country at the heart of Western civilization? How could the Nazis, in such a short span of time, establish a racially based totalitarian regime, and plunge the world into a war that consumed millions of lives while leaving the devastating legacy of the Holocaust in its wake? Students will understand the historical foundations of German unification, and the outcomes of World Wars I and II. Students will also learn of the long-term implications on the modern state of Germany. We will use primary and secondary sources to provide deeper insights into the mindset that created and perpetuated the Holocaust. Textbooks, supplemental readings, film documentaries, novels, a visit to the local Holocaust Memorial Museum, and outreach to local survivors help answer these questions. Tests, papers, and quizzes will assess student understanding of the material.", "b": "How the Nazis rose to power and how the Holocaust happened."}, {"id": "5535", "nums": "5535", "t": "History of Feminist Thought in the Modern World", "d": "hist", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "History of Feminist Thought in the Modern World traces the development of the global women’s liberation movement and expansion of feminist thinking since the Enlightenment. The course focuses on four major stages: Roots of Feminist Thought (pre-19th century), First Wave Feminism (1830s-1920s), Second Wave Feminism (1950s-1980s), and Third Wave Feminism (1990s-present). While much of the ideology and literature framing international women’s liberation developed in the West, the course also weaves non- Western histories into the narrative. Examples from Communist China, Catholic Latin America, post-Colonial Africa, and the Middle East will help highlight the ways in which feminists have struggled for gender equality under a variety of political, social, and religious structures. Students will collaborate with classmates on discussions, projects, and activities throughout the semester. A final research project ends the semester incorporating student creativity and application of the major theories explored.", "b": "The history of feminist ideas and women's movements around the world."}, {"id": "5549", "nums": "5549", "t": "History of American Architecture: Early", "d": "hist", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "History of American Architecture: Early will provide students with an understanding of the origins of architecture in America and the beginning of American cities through the built environment. Selected topics will include regional Native American cultures, colonial, early American, Victorian and Arts and Crafts styles and periods. This leads to the growth of development of American cities through early urban planning and the first skyscrapers. To put the local area in context students will also learn about Metropolitan Detroit and examine the origins of the founding of the Cranbrook Educational Community with a special focus on the Schools. Field trips both on and off campus will allow students to explore the various styles, and buildings we examine together in class. Assessments will include reading homework, visual identification quizzes, and unit tests. The semester will end with a research project designed by the student to explore a related topic of their choosing in depth.", "b": "The beginnings of American architecture and cities."}, {"id": "5654", "nums": "5654", "t": "History of American Architecture: Modern", "d": "hist", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "History of American Architecture: Modern will provide students with a greater understanding of the continued evolution of architecture in America and the rapid growth of American cities in this period. Selected topics include Art Deco, Industrial, Mid- Century Modern, Brutalism, Post-Modern and Contemporary styles. Continued changes to American cities including Urban Renewal, Public Housing and Preservation will also provide context to the history of the century. The final unit will cover the modern issues architecture and architects face in the 21st century including Green Architecture, Supertall Skyscrapers, and Climate and Housing concerns. To put the local area in context students will also examine the continued expansion and evolution of the Cranbrook Educational Community. Field trips both on and off campus will allow students to explore the various styles, issues, and buildings we examine together in class. Assessments will include reading homework, visual identification quizzes, and unit tests. The semester will end with a research project designed by the student to explore a related topic of their choosing in depth.", "b": "How American architecture and cities evolved in the modern era."}, {"id": "5545", "nums": "5545 / 5648", "t": "The Human Footprint", "d": "hist", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "The guide says this course will not run in 2026-27; check whether it returns.", "desc": "How did we get here, where are we going, and what is the best way to get there? These have been the essential questions of the collective human experience for millennia. This course will take an in-depth look at the trajectory of human history, what major events have caused/alerted that trajectory, and the potential that we currently have to shape what comes next. While its core emphasis is on the study of the human experience, it weaves together humanities with the study and application of science, creating an authentically interdisciplinary experience. Moreover, with its emphasis on project-based learning, the course is designed to create a hands-on experience, empowering students to create real-life solutions in an effort to forge our collective next steps forward and to…save the world. Will not run during the 2026-27 school year.", "b": "Humanity's impact on the world, and where we go from here."}, {"id": "5656", "nums": "5656", "t": "Feminism and the Media", "d": "hist", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course provides an overview of women's historical and contemporary involvement in various media (including advertising, print journalism, film, television, radio, and digital media) from the 19th Century to the present. It analyzes the challenges women have faced due to gender inequalities and stereotypes, and it highlights the significant contributions of key women in the field. Students will apply theories of gender, feminism, and media to critically analyze texts, production practices, and audiences from an intersectional perspective, considering race, class, and sexuality. Key topics include the historical struggles for recognition, the portrayal of women, and the impact of feminist movements on media representation and industry practices. Students will be assessed through a variety of formative and summative methods including discussion, in-class writing, objective quizzes, and individual and group projects reflecting the multitude of media studied throughout the term.", "b": "Women's roles in media, from 19th-century print to the internet."}, {"id": "6503", "nums": "6503", "t": "Ethics: Philosophical Perspectives", "d": "rel", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "What is important? What is real? What is good? In today’s pluralistic world is any consensus possible? This course tackles these questions as well as addressing how we make choices. We will apply ethical theories to perennial moral questions and to our daily personal decisions, conduct, and identity. Our core study will include major figures in philosophy such as Kierkegaard, Heidegger, Camus, de Beauvoir, Baudrillard, and King. Unit tests and in-class writings are factored into the semester grade.", "b": "Big questions about what is good and how to make moral choices."}, {"id": "6616", "nums": "6616", "t": "Aesthetics: Philosophy of Art", "d": "rel", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "George Booth believed that “a life without beauty is only half lived.” The philosophical study of art poses many questions including art’s definition, function, meaning, importance, and relation to beauty. This course examines these questions through the eyes of Plato, Aristotle, Hegel, Foucault, Mudimbe and Suzuki. The Cranbrook Art Museum collection and Cranbrook’s Cultural Properties serve as primary resources. In addition to studying theory, students analyze works of art using the aesthetic theories learned in class. Assessments include tests, in-class writings, critical essays, and a presentation.", "b": "What art is, why it matters, and how beauty works."}, {"id": "6618", "nums": "6618", "t": "Ethics: Philosophy as a Way of Life", "d": "rel", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Many people think of philosophy as a set of abstract beliefs. For much of human history, however, philosophy was a way of life that included questions, practices, and living in the world in concrete ways. Philosophers also sought to change the world through philosophical reflection and practice. This course explores how philosophy can be a way of living in our world. Logic and argument evaluation are taught using contemporary news and marketing. Historical examples of how philosophy informed the way people lived are studied, including philosophers such as Socrates, Marcus Aurelius, and James Baldwin. Specific issues in economics, language, politics, and morality are also addressed. Assessments include a weekly journal for philosophical reflection, tests, quizzes, papers, and a semester examination. Pierre Hadot’s Philosophy as a Way of Life is the textbook.", "b": "Philosophy as a practical way to live, not just a set of ideas."}, {"id": "6507", "nums": "6507 / 6624", "t": "The Problem of Evil", "d": "rel", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course explores the Problem of Evil, also known as the “Theodicy Problem.” Put simply, this problem asks: if God is all good and all powerful, then why do human beings suffer so much? Since theodicy is a discourse that shows up mainly in monotheistic religions, we will focus on the Abrahamic tradition: Judaism, Christianity and Islam. We will also look at the treatment of suffering within Buddhism for an Eastern perspective. Readings will include excerpts from sacred texts, including the Tanakh, the Christian Bible and the Quran, in addition to essays by notable philosophers and theologians. Students will be encouraged to grapple with ideas of cosmic justice on an abstract level, and to apply them to instances of real-world suffering including historical, contemporary, and personal examples. Assessments involve short in-class essays and leading one seminar presentation during the semester. The final will be a paper that compares multiple approaches to resolving the theodicy problem.", "b": "Why suffering exists if God is all good and all powerful."}, {"id": "CD001", "nums": "CD001-REL / CD001-CSE", "t": "Ethics of AI: Safeguarding Humanity", "d": "rel", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Cross-listed in Religion & Philosophy and Computer Science; counted here toward Religion & Philosophy.", "desc": "From military drones to shopping recommendations, AI is powering a wide array of smart products and services across nearly every industry—and with it, creating new ethical dilemmas for which there are no easy answers. Moreover, those involved with AI often lack the tools and knowledge to expertly navigate ethical challenges. This course examines today’s most pressing ethical issues related to AI and explores implications for AI design, warfare and politics, policy making, and responsibility—both individual and corporate. Students will be pushed to think about AI in terms of what is truly good, not just advantageous. While the course will be largely project based, assessment will also be in the forms of presentations, essays, exams and machine learning projects.", "b": "The ethical dilemmas created by AI, from drones to recommendations."}, {"id": "7100", "nums": "7100", "t": "Concert Choir", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "", "pre": "No audition necessary", "req": "", "fl": "", "note": "", "desc": "The purpose of this course is to give all interested students the experience of singing in a large mixed-voice ensemble. Students will explore and sing a variety of choral literature from classical to contemporary.", "b": "A large mixed-voice choir singing everything from classical to contemporary."}, {"id": "7120", "nums": "7120", "t": "Madrigals", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "Audition (treble voices)", "req": "", "fl": "", "note": "", "desc": "This ensemble is for the experienced female singer who wishes to study, sing and perform a wide range of difficult female-chorus literature. The Madrigals perform throughout the community as well as for the Department’s scheduled concerts. In addition, this ensemble presents its own concerts twice a year and participates in the Michigan Schools Vocal Music Association solo and ensemble festival.", "b": "An auditioned treble choir that performs challenging music around the community."}, {"id": "7200", "nums": "7200", "t": "Concert Band", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "2-4 years playing experience. Audition required for new students", "req": "", "fl": "", "note": "", "desc": "This class is the intermediate band in the Upper School and is designed to provide exposure to a variety of musical styles. Tone quality, intonation, rhythm, technique, and interpretation of concert band repertoire are all emphasized. Students have the opportunity to perform in the district and state solo and ensemble festivals, winter, and spring concerts as well as other events.", "b": "The intermediate band, playing a wide variety of musical styles."}, {"id": "7220", "nums": "7220", "t": "Symphony Band", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "Instr. Audition required for new students", "req": "", "fl": "", "note": "", "desc": "This ensemble is designed for the advanced wind or percussion instrumentalist. Advanced tone quality, intonation, rhythm, technique, and interpretation of symphonic band repertoire are all emphasized. Selected members may perform in the Jazz Band, Orchestra, and Pit Orchestra for the musical. Students have the opportunity to perform in the district and state solo and ensemble festivals, winter, and spring concerts as well as other events. Private lessons are strongly encouraged for this ensemble.", "b": "The advanced band for experienced wind and percussion players."}, {"id": "7320", "nums": "7320", "t": "Orchestra", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "Audition required for new students", "req": "", "fl": "", "note": "", "desc": "The Orchestra consists of string players in grades 9 through 12 who have at least four years of experience. Educational emphasis is placed on advancement of string techniques, independent musicianship and an understanding of ensemble playing. Students are expected to know musical terminology and theory that is frequently used in orchestral repertoire. The most common scales are expected to be played in at least two octaves. Participation opportunities are offered for both the District and State Solo and Ensemble Festivals. The Orchestra performs two major concerts each year.", "b": "A string orchestra for players with at least four years of experience."}, {"id": "7300", "nums": "7300", "t": "Chamber Orchestra", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "Audition required", "req": "", "fl": "", "note": "", "desc": "The Chamber Orchestra is designed for the top string players in grades 9 through 12. An audition is required for entry. Expectations include mature interpretation of string orchestra literature and proficiency with advanced string techniques. Select members are assigned to one of four string quartets and may also be given the opportunity to perform with the Pit Orchestra for the musical. Four major concerts are presented each year and students also have the option to participate in the District and State Solo and Ensemble Festivals. Chamber Orchestra students also augment the Orchestra during concerts in December and April. Private lessons are strongly encouraged.", "b": "An auditioned ensemble for the top string players."}, {"id": "7440", "nums": "7440", "t": "Intermediate Dance", "d": "perf", "term": "Y", "cr": 1, "g": [9, 10, 11, 12], "appr": "Audition", "pre": "Audition", "req": "", "fl": "", "note": "", "desc": "This course focuses on the development of technical, performance, and creative dance skills. Expectations require the student's willingness to strive for achievement in the areas of technique, improvisation, and performance. Technique studies will include modern/contemporary style dance with jazz, ballet, and musical theater dance units. Students will perform in the Winter Festival Concert and the Evening of Dance Concert. Students also can choreograph and present dances at the Annual Strickland Choreography Competition. Students will have experiences with guest artists in choreographic residencies and masterclasses. Basic dance experience or instructor approval required.", "b": "Build dance technique, improvisation, and performance skills."}, {"id": "7460", "nums": "7460", "t": "Advanced Dance", "d": "perf", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Audition", "pre": "Audition", "req": "", "fl": "", "note": "", "desc": "This is a comprehensive course for the highly motivated student who has achieved proficiency in technical skills through the intermediate level, and who exhibits creativity and expressiveness in composition and performance. Technique studies will include modern/contemporary style dance with jazz, ballet, and musical theater dance units. Students will perform in the Winter Festival Concert and the Evening of Dance Concert. Students also choreograph and present dances at the Annual Strickland Choreography Competition. Other performance opportunities are possible. Students will have experiences with guest artists in choreographic residencies and masterclasses.", "b": "Advanced dance technique, choreography, and performance."}, {"id": "7401", "nums": "7401 / 7402", "t": "Movement and Conditioning", "d": "perf", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Students will experience various movement practices such as yoga, pilates, dance, and other somatic techniques learning to integrate these practices and concepts into sports, fitness, and everyday wellness. Students will concentrate on body awareness, alignment, and safe and efficient ways of moving, enhancing coordination, flexibility, and core strength. Basic anatomy and body/mind centering concepts will be emphasized as well. No rehearsal or performances are required.", "b": "Yoga, Pilates, dance, and other movement practices for fitness and wellness."}, {"id": "7501", "nums": "7501 / 7602", "t": "Speech", "d": "perf", "term": "S", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course is designed to provide the fundamentals of speech preparation and delivery based on the five canons of rhetorical composition. A minimum of eight graded speeches (2-10 min. in length) is required. The main emphasis is on informative speaking. Assignments include demonstration, visual aid, reporting and special occasion speeches. Impromptu delivery techniques, reading from a manuscript, and memorizing are included. Extensive bibliography for research, listening projects, final speech for exam. This course can only be taken once.", "b": "Learn to write and deliver speeches with confidence."}, {"id": "7503", "nums": "7503 / 7604", "t": "Acting", "d": "perf", "term": "S", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course introduces students to the art of theatrical performance with an emphasis on the interpretive art of acting. Course content includes the study of theatre history, contemporary theories of acting, and in-class performances. The course develops vocal, physical, and intellectual skills through improvisation, textual analysis, observation, discussion, memorization, stage directions, theatre games, monologues, and scene work. Focus of the course is directed toward areas of performance that enhance and support the student's imagination, creativity, and self-confidence. 12th grade students can take this course with instructor approval.", "b": "An introduction to acting, theatre history, and performance."}, {"id": "7608", "nums": "7608", "t": "Advanced Theatre and Performance", "d": "perf", "term": "S2", "cr": 0.5, "g": [10, 11, 12], "appr": "Instr.", "pre": "Instructor Recommendation Only", "req": "", "fl": "", "note": "", "desc": "This course is designed to extend and deepen the student’s growing knowledge of performance. It will develop and expand upon the techniques introduced in the beginning acting classes, continuing the exploration of character development through textual analysis, physical characterization, and emotional exploration. This will be accomplished by providing a wide variety of advanced acting exercises, monologues, and scene study to broaden the student’s imagination and creative subconscious, deepening their understanding of text, motivation, and characterization. Student performers are encouraged to audition for the main stage productions and will be required to participate in a monologue or scene study showcase at the end of the semester.", "b": "Deepens acting skills for students who've taken Acting."}, {"id": "7511", "nums": "7511 / 7612", "t": "Video Production", "d": "perf", "term": "S", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This project-oriented class introduces students to the entire production process from scripting and storyboarding, to filming and editing to create a finished product. For each production, students learn and apply a range of acting, filming, and editing techniques and tools. As the film projects become more complex throughout the semester, students will have opportunities to focus on the areas of film making that most interest them both in front of and behind the camera.", "b": "Write, film, and edit your own video projects from start to finish."}, {"id": "7616", "nums": "7616", "t": "Advanced Video Production", "d": "perf", "term": "S2", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "Video Production or Instr.", "req": "7511", "fl": "", "note": "", "desc": "This course explores filming and editing techniques that are beyond the scope of the introductory Video Production course and is designed for students with previous video production experience. This project-based class will allow students to explore the science, art, skills, and tools used to create engaging visual stories. Specific techniques and equipment covered in this repeatable class will vary depending on student interest and the requirements of each project.", "b": "Advanced filming and editing techniques for experienced video makers."}, {"id": "7618", "nums": "7618-1", "t": "Scriptwriting", "d": "perf", "term": "S1", "cr": 0.5, "g": [10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "Write like an award-winning professional! This course will teach the basics of three different styles of scriptwriting; screenwriting, playwriting, and comedy writing. Students will hold conversations with professional writers from the area who are responsible for some of the most popular shows and movies including The Golden Girls (television), Saturday Night Live (comedy writing), Reel Steel (movie), and Detroit ’67 (stage). Students will study the elements of scriptwriting and how they apply to all styles. The final project will be a fully fleshed out and formatted script to be submitted to national scriptwriting competitions.", "b": "Write screenplays, stage plays, and comedy."}, {"id": "8501", "nums": "8501 / 8602", "t": "Foundations in Design", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "This beginning level course cultivates creative thinking through challenging assignments that explore visual elements and design principles that underpin art, design, and architecture. In the studio, students practice skills of inquiry to enjoy experiential learning and are encouraged to make connections while asking the questions, how and what if. Two-dimensional and three-dimensional spatial ideas are investigated in making processes that use varied media, materials, and technologies.", "b": "Creative problem-solving with the design principles behind art and architecture."}, {"id": "8503", "nums": "8503 / 8604", "t": "Design Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Foundations in Design or Drawing and Instr.", "req": "8501|8505", "fl": "h", "note": "Meets 3 times per week.", "desc": "This course provides the advanced student time to research an area of design and with the guidance of the instructor, develop creatively, both conceptual and material aspects of a selected project. Students are expected to accomplish at a high level, working with greater independence, taking risks and documenting progress. Students engage in critical analysis of their work and other artists, designers and cultural styles to develop a unique point of view.", "b": "Research and develop your own design project with a mentor."}, {"id": "8505", "nums": "8505 / 8606", "t": "Drawing", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "This course is concerned with developing visual, aesthetic, and technical skills. Through a variety of drawing media students learn to solve the traditional and contemporary problems of pictorial composition. Students will focus on the Principles and Elements of Art, as well as the application of those components to their artwork. Students are expected to take creative risks and cultivate a strong critical awareness.", "b": "Build drawing skills with a variety of materials and techniques."}, {"id": "8507", "nums": "8507 / 8608", "t": "Drawing Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Drawing and Instr.", "req": "8505", "fl": "h", "note": "Meets 3 times per week.", "desc": "This class is for students who are skilled at drawing and who want to expand their ideas about the meaning of art. We explore a wide range of materials and techniques, as well as art history and criticism. Students are strongly encouraged to create their own unique imagery within a thematic concentration, and active participation in weekly critiques is expected. By semester’s end each student will have produced a substantial and varied portfolio of drawings. Students will work outside of class regularly, taking risks and documenting progress.", "b": "Advanced drawing that explores ideas and art history."}, {"id": "8551", "nums": "8551 / 8666", "t": "Painting", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "Drawing", "req": "8505", "fl": "", "note": "Meets 3 times per week.", "desc": "After an introduction to the materials and subject possibilities of painting, the emphasis of this course is on construction, composition, paint handling and color. Students study a number of contemporary painters in order to understand their problems and the solutions they developed. Students then attempt to confront the same problems and find their own unique solutions. Students will use watercolor, tempera, gouache, and acrylic paint. Oil paint may be used by advanced students and students who have prior experience with the medium.", "b": "Painting materials, composition, color, and technique."}, {"id": "8567", "nums": "8567 / 8668", "t": "Painting Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Painting and Instr.", "req": "8551", "fl": "h", "note": "Meets 3 times per week.", "desc": "This course provides students with an intensive experience in the aesthetics, conceptual development and media of painting. Students extend their range of painting techniques and their study of art history and criticism. Students are expected to work inside and outside of the classroom on conceptual assignments, develop their portfolio, assist in the studio, and take active part in weekly critiques. Each student works with the instructor to develop a plan for the semester. Evaluation is based on criteria established to encourage students to meet exceptional standards, to grow in freedom and originality of expression, and to demonstrate conceptual and technical ability. Students are expected to work an additional 4-6 hours outside of the classroom each week. This course requires instructor approval.", "b": "An intensive painting studio focused on developing your own ideas."}, {"id": "8555", "nums": "8555 / 8656", "t": "Digital Photography", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "Foundations in Design or Drawing", "req": "8501|8505", "fl": "", "note": "Meets 3 times per week.", "desc": "This course introduces students to the techniques for capturing photographic images using a digital camera and manipulating those images using photo-editing software, such as Photoshop Elements, accessible on computers in the labs and libraries. Students explore digital photography as a vehicle for self-expression, creativity, and critical thinking through the development of camera technique combined with artistic elements and principle and design. Students engage in critiques with time reserved for discussion of historical and contemporary photography. In addition to classroom work, students are expected to take photographs outside of class. The portfolios created by students may be thematic in content or represent a carefully considered sequence of experimental work. Students will need to provide a personal point-and-shoot or DSLR camera.", "b": "Shoot digital photos and edit them with photo software."}, {"id": "8557", "nums": "8557 / 8658", "t": "Digital Photography Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Digital Photography and Instr.", "req": "8555", "fl": "h", "note": "Meets 3 times per week.", "desc": "This course provides students an intensive experience in the aesthetics, conceptual development and media of digital photography. Students explore a wide range of techniques, as well as art history and criticism. Students are expected to work out of the classroom on conceptual assignments, develop their portfolio, assist in the studio and actively take part in weekly critiques. The individual student will work with the instructor to develop a plan for the semester. Evaluation is based on criteria established to meet exceptional standards, with growth in freedom and originality of expression, and on demonstration of conceptual and technical ability. The student is expected to work an additional 4 hours outside of the classroom each week. This course requires instructor approval.", "b": "Advanced digital photography focused on developing your own style."}, {"id": "8511", "nums": "8511 / 8612", "t": "Ceramics", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "In this course, ceramic students begin a study of three-dimensional form and process by exploring the material qualities of clay. Students use traditional hand-building methods of slab construction, coiling and pinching and then progress to basic wheel throwing technology. Learning how to wedge, center, shape, finish, glaze, and fire, complete the semester’s production. This beginning level emphasizes a set of skills for working in the studio and builds a foundation for critical thinking necessary to evaluate ceramic works, explore artistic intent and better understand the design of functional objects.", "b": "Hand-build and shape clay into three-dimensional forms."}, {"id": "8517", "nums": "8517 / 8618", "t": "Ceramics Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Ceramics and Instr.", "req": "8511", "fl": "h", "note": "Meets 3 times per week.", "desc": "This course provides the student who excels in ceramics the opportunity for advanced research and deeper understanding of historical reference, leading to a more critical and personal expression of form. Students are expected to extend their knowledge of ceramic processes and work towards expertise in one area. Students work toward a high level of accomplishment in skill development and learning to take creative risks. Students work with the instructor in setting goals. All students participate in loading and firing the kiln and learning proper care of studio equipment.", "b": "Advanced ceramics with more personal and critical work."}, {"id": "8521", "nums": "8521 / 8622", "t": "Sculpture", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "The purpose of this course is to introduce the student to three-dimensional form through the concepts, materials, tools and techniques of sculpture. Students are required to conceive and produce at least two sculptures. Principles of design and art history are presented. Advanced students may explore software and film as a method for understanding space. Evaluation is based on personal growth in idea, commitment, and quality of work produced. Media used include plaster, wood, steel, bronze, and found objects.", "b": "Create three-dimensional art with a range of materials and tools."}, {"id": "8527", "nums": "8527 / 8628", "t": "Sculpture Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Sculpture and Instr.", "req": "8521", "fl": "h", "note": "Meets 3 times per week.", "desc": "This course provides students an intensive experience in the aesthetics, conceptual development and media of sculpture. Students explore a wide range of materials and techniques, as well as art history and criticism. Students are expected to work out of the classroom on conceptual assignments, develop their project in the studio and take part in weekly critiques. Students work with the instructor to develop a plan. Evaluation is based on meeting exceptional standards, with growth in freedom and originality of expression, and demonstration of conceptual and technical ability.", "b": "An intensive sculpture studio with your own projects."}, {"id": "8531", "nums": "8531 / 8632", "t": "Weaving and Fiber Arts", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "Students in Weaving and Fiber Arts concentrate on floor loom weaving as it relates to the contemporary field of Fiber Arts. They explore various materials and techniques including collage, tapestry, sewing, digital photography, embroidery, computerized weaving, fashion, and product design. All activities of the weaving studio use thread as the basic material for creative and individual expression. Beginning weavers gain a familiarity with the entire process of weaving. Intermediate and advanced weavers take on more creative challenges to further their understanding of the loom's capabilities. They manipulate the cloth once it is off the loom in unexpected ways. Inspiration for all projects comes from students' personal experiences and ideas, the cultural and historical use of textiles from around the world, from fashion, the decorative and fine arts, and the materials and techniques themselves.", "b": "Floor-loom weaving and fiber art techniques."}, {"id": "8537", "nums": "8537 / 8638", "t": "Weaving and Fiber Arts Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Weaving and Instr.", "req": "8531", "fl": "h", "note": "Meets 3 times per week.", "desc": "Weaving and Fiber Arts Studio Honors involves the advanced student in sophisticated projects that are designed by the student with the instructor. Students bring to the table their own project ideas, research, and motivation. The Studio Honors Fiber student engages more deeply in the medium and creates finely finished projects.", "b": "Advanced weaving projects you design with the instructor."}, {"id": "8541", "nums": "8541 / 8642", "t": "Metalsmithing/Creative Jewelry", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "Metalsmithing develops the student’s creative ability through projects that utilize the plastic qualities of non-ferrous metals: copper, brass and bronze. Instruction includes forging, raising, soldering, or construction of functional or non-functional three-dimensional forms. Creative ideas are encouraged through critiques and slide lecture discussions of historic and contemporary metalsmithing. Creative Jewelry utilizes the plastic qualities of metal. Forging, sawing, filing, soldering and polishing techniques are examined in the initial semester. Subsequent semesters include casting, fabrication and stone-setting skills. Non-commercial attitudes of inventive design are stressed through critiques and slide presentations of historic and contemporary jewelry production and adornment.", "b": "Make jewelry and objects from copper, brass, and bronze."}, {"id": "8547", "nums": "8547 / 8648", "t": "Metalsmithing/Creative Jewelry Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Metal/Jewelry and Instr.", "req": "8541", "fl": "h", "note": "Meets 3 times per week.", "desc": "This intensive course is based on the acquired skills and aesthetics of the Metalsmithing /Creative Jewelry course. The students develop their own direction for what they plan to accomplish during this course and consult with the teacher throughout the semester. The students are asked to develop unique concepts that are highly crafted that use advanced techniques and include alternative materials for their projects. Techniques such as complex forging, masonite die forming, extensive angle raising hollowware, hollow construction, Keum Boo, repousse and chasing, advanced glass bead making, PMC (Precious Metal Clay) or advanced casting may be explored.", "b": "Advanced metalsmithing where you set your own direction."}, {"id": "8583", "nums": "8583 / 8684", "t": "Fashion Design", "d": "fine", "term": "S", "cr": 0.25, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "Meets 3 times per week.", "desc": "Fashion Design is a studio art class where students design and construct wearable works of art. Fundamental skills surrounding fashion design will be taught and expanded upon. Students will learn the many skills of fashion design including fashion drawing, mood boards, pattern making, sewing construction, and finishing. We will look at a wide variety of designers from a variety of contexts including those from history, other cultures, and those who are cutting edge. Projects may range from the more traditional to the experimental and sculptural.", "b": "Design and sew wearable works of art."}, {"id": "8589", "nums": "8589 / 8692", "t": "Fashion Design Studio H", "d": "fine", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "Instr.", "pre": "Fashion Design and Instr.", "req": "8583", "fl": "h", "note": "Meets 3 times per week.", "desc": "Studio Honors Fashion Design is for students who demonstrate a high level of achievement in both craft and concept in the Fashion Design courses. Students work independently under the guidance of the instructor. They will conduct research as it applies to their particular projects including fashion designers, cultural and historical movements of fashion, particular technologies and skills as it relates to fashion, etc. Honors students also will write and refine an artist statement describing their work and thought processes. All work will be presented in a formal critique at the end of the semester. Studio Honors students are expected to be self-motivated, hardworking, deep thinkers, and show passion for Fashion Design.", "b": "Independent advanced fashion design projects."}, {"id": "9509", "nums": "9509 / 9612", "t": "Introduction to Computer Science I", "d": "cse", "term": "S", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "", "req": "", "fl": "six", "note": "", "desc": "This entry-level programming course assumes no computing background. Students are introduced to computer science fundamentals using the coding language Python. The course covers essential programming concepts, including variables, loops, conditionals, and functions; the data types, strings, and lists are also extensively studied. This course serves as a strong foundation for further study in computer science and prepares students for AP Computer Science A and other non-core courses. Small to medium-sized coding projects are the basis of student evaluation. A significant project replaces the final examination, encouraging creativity and practical application of programming skills.", "b": "Beginning programming in Python, with no experience needed."}, {"id": "9513", "nums": "9513 / 9616", "t": "Introduction to Computer Science II", "d": "cse", "term": "S", "cr": 0.5, "g": [9, 10, 11, 12], "appr": "", "pre": "ICS I", "req": "9509", "fl": "six", "note": "The guide lists 9616 for both this course and Cyber Security II; confirm the number when registering.", "desc": "This course is a continuation of the project-based Introduction to Computer Science 1 and it is assumed that the incoming student is familiar with Python programming basics such as decisions, loops, lists, and functions. In iCS2, students will learn additional data structures including dictionaries and begin coding using object-oriented strategies. From this course, a student would be prepared to enter Advanced Placement Computer Science or Directed Studies.", "b": "More Python projects after Intro to CS I."}, {"id": "9780", "nums": "9780", "t": "AP Computer Science A", "d": "cse", "term": "Y", "cr": 1, "g": [10, 11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "This college-level course is less about facts and formulas and more about learning and understanding how to work through problems. The course uses Java to focus on programming theory, algorithmic thinking, and data structures. No prior experience in Java is required, but students should have a foundation in logical reasoning and computational thinking. Key topics include object-oriented programming, searching and sorting algorithms, data structures (arrays, ArrayLists, and recursion), and simulations. Students engage with interactive online platforms and hands-on coding exercises to develop a deep understanding of these concepts. This course prepares students for the AP Computer Science A Exam in May.", "b": "College-level Java programming and problem solving, with an AP exam."}, {"id": "9770", "nums": "9770", "t": "Advanced Topics: CS Data Architecture", "d": "cse", "term": "Y", "cr": 1, "g": [11, 12], "appr": "", "pre": "APCSA or Dept. Rec.", "req": "9780", "fl": "ap", "note": "", "desc": "Intended for the student considering a college major in computer science, this course will examine the design, implementation, and analysis of fundamental data structures, including arrays, linked lists, stacks, queues, trees, heaps, and graphs. The curriculum also covers algorithmic techniques such as recursion, sorting, searching, dynamic programming, and graph traversal. The primary focus is to help students develop a deep understanding of these concepts and techniques. Students will demonstrate their learning through tests and practical programming assignments.", "b": "Data structures and how to design efficient programs."}, {"id": "9760", "nums": "9760", "t": "Advanced Topics: CS Data Science and Machine Learning", "d": "cse", "term": "Y", "cr": 1, "g": [12], "appr": "", "pre": "AP CSA; AT Calc II/III (completed or concurrent) or Dept. Rec.", "req": "9780;2810~", "fl": "ap", "note": "", "desc": "This course extends the foundations established in Advanced Topics in Computer Science: Data Architecture by introducing students to the world of data-driven computing, statistical analysis, and machine learning. It focuses on how data informs decision-making and how algorithms learn from patterns. Students explore modern tools and frameworks that are transforming industries through artificial intelligence and analytics. Designed for motivated students who have completed AP Computer Science A, this full-year course blends theory, coding, and application to prepare students for introductory college-level courses in data science, computer engineering, and artificial intelligence. Students learn how to collect, clean, analyze, and visualize data to uncover meaningful insights. They study the fundamentals of machine learning, including supervised and unsupervised learning, regression, classification, and neural networks, while also examining ethical implications and bias in algorithmic systems. Projects emphasize real-world applications such as predictive modeling, natural language processing, and image recognition implemented in Python using libraries like NumPy, pandas, matplotlib, and scikit-learn.", "b": "Data science, statistics, and machine learning with code."}, {"id": "9517", "nums": "9517", "t": "Cyber Security I", "d": "cse", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "", "note": "", "desc": "Cybersecurity is defined as the steps and processes taken to protect networks, devices, programs, and data from unauthorized access that can result in theft or damage. Small and large companies alike put cybersecurity measures into place to protect their network, as well as to restrict employees from visiting websites that may compromise sensitive data. It's just as important as any measures a company takes to secure their trade secrets or physical assets from being compromised. This covers the first half of the COMPTIA SEC+ Qualification", "b": "How networks, devices, and data are protected from attacks."}, {"id": "9616CY", "nums": "9616", "t": "Cyber Security II", "d": "cse", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "Dept. Rec.", "pre": "Cyber Security I and Dept. Rec.", "req": "9517", "fl": "", "note": "", "desc": "The course explains security fundamentals including core principles, critical security controls, and cybersecurity best practices. Students will also evaluate specific security techniques used to administer a system that meets industry standards and core controls, assess high-level risks, vulnerabilities, and attack vectors of a sample system, and explain ways to establish and maintain the security of different types of computer systems. Students will gain exposure to a diverse group of technologies that will provide or enhance the skills needed to enter the cybersecurity field. You will follow the COMPTIA SEC+ Curriculum which is the industry standard for IT professionals.", "b": "Core cybersecurity principles and best practices in more depth."}, {"id": "9519", "nums": "9519", "t": "Engineering and Design I", "d": "cse", "term": "S1", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "This course introduces students to engineering and applied design through hands-on, project-based learning. Students explore the fundamentals of mechanical and electrical systems while applying the engineering design process—defining problems, prototyping, testing, and refining solutions. Using fabrication tools, electronic components, and sensors, they develop projects that balance function and form. Collaboration, creativity, and safety guide every step. Through two design challenges, students build confidence in building, problem-solving, and technical communication, culminating in projects that showcase precision, ingenuity, and teamwork.", "b": "Hands-on engineering projects with mechanical and electrical systems."}, {"id": "9622", "nums": "9622", "t": "Engineering and Design II", "d": "cse", "term": "S2", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "Engineering and Design I", "req": "9519", "fl": "", "note": "", "desc": "Building on the foundation of Engineering and Design I, this advanced course challenges students to apply engineering principles to more complex mechanical and electrical systems. Students undergo an extended design-build cycle that includes research, 3D modeling, material testing, fabrication, and performance evaluation. Course projects emphasize functionality, reliability,
