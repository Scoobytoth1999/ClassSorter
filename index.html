and form. The semester concludes with a capstone project.", "b": "More complex engineering builds after Engineering and Design I."}, {"id": "9400", "nums": "9400", "t": "Advanced Topics: Humanities Research Seminar", "d": "x", "term": "Y", "cr": 1, "g": [11, 12], "appr": "Dept. Rec.", "pre": "", "req": "", "fl": "ap", "note": "", "desc": "This course introduces students to collegiate level learning in the humanities. With the help of the instructor, students learn to create, develop, and execute their own major project over the course of the year. Depending on the student’s interests and academic plans, projects can range from an art and/or performance-based project to more traditional research projects. Though projects differ by student, each requires a substantial written component. The project culminates in an oral defense to the class and instructor. With the assistance of the instructor, each student finds and utilizes an external expert to consult with on their specific project. In addition to the oral defense, assessment consists of quizzes, tests, and papers, aimed at completing the student’s project. The required texts are Rebecca Moore Howard’s Writing Matters and Cal Newport’s Deep Work.", "b": "Design and complete your own college-level humanities research project."}, {"id": "9411", "nums": "9411 / 9412", "t": "The Human Question: Defining Humanity in a Digital Age", "d": "x", "term": "S", "cr": 0.5, "g": [11, 12], "appr": "", "pre": "", "req": "", "fl": "", "note": "", "desc": "“What does it mean to be human in our technocentric culture?” Learners investigate this question as individuals, on teams and from a wider human perspective. Through a multidisciplinary blend of psychological concepts, philosophical thought, and modern neuroscience, they consider the blurring line between “man” and machine. Learners assess how this tension impacts their personal lives, the digital landscape, and the future of human society. They present their findings through wri /* ---------- state ---------- */
const KEY = "fouryears.v1";

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const fmtCr = n => { const m = {0.25:"¼",0.5:"½",0.75:"¾"}; const w = Math.floor(n+1e-9), f = +(n-w).toFixed(2); return (w? w : "") + (f? m[f] : "") || "0"; };

/* offered in a given grade? (alternating-year courses) */
function altOK(c, g){
  const m = c.fl.match(/alt(\d)/); if (!m) return true;
  const y = (S.setup?.start || 2027) + (g-9);         // fall year
  return ((y - 2026) % 2) === +m[1];                   // 2026-27 = alt0, 2027-28 = alt1
}

/* ---------- prerequisite engine ---------- */
function placementDone(){
  const st = S.setup || {}; const d = new Set(MATH_START[st.math]?.done || []);
  if (st.lang && st.level===2) d.add(LANG_PATH[st.lang][0]);
  return d;
}
function context(plan, g, sem){
  const done = placementDone(), conc = new Set();
  for (const it of plan.items){
    if (it.g < g || (it.g===g && it.sem==="S1" && sem==="S2")) done.add(it.cid);
    else if (it.g===g) conc.add(it.cid);
  }
  return {done, conc};
}
function maxRank(set){ let r=0; for (const id of set) r = Math.max(r, MATH_RANK[id]||0); return r; }
function clauseMet(cl, ctx){
  const conc = cl.endsWith("~"); cl = cl.replace("~","");
  const pool = conc ? new Set([...ctx.done, ...ctx.conc]) : ctx.done;
  return cl.split("|").some(tok => {
    if (tok.startsWith("m>=")) return maxRank(pool) >= parseFloat(tok.slice(3));
    if (GROUPS[tok]) return GROUPS[tok].some(id => pool.has(id));
    return pool.has(tok);
  });
}
function clauseText(cl){
  const conc = cl.endsWith("~"); cl = cl.replace("~","");
  const parts = cl.split("|").map(tok => {
    if (tok.startsWith("m>=")) { const v = parseFloat(tok.slice(3));
      return v>=5.5 ? "AP Calculus AB or higher" : v>=5 ? "Calculus or higher" : v>=4.6 ? "Pre-Calculus H or higher" : v>=4.2 ? "Pre-Calculus or higher" : v>=4 ? "Pre-Calculus Essentials or higher" : "Algebra II (or Essentials)"; }
    if (tok==="BIO") return "Biology"; if (tok==="CHEM") return "Chemistry";
    return BY[tok]?.t || tok;
  });
  return parts.join(" or ") + (conc ? " (this year or earlier)" : "");
}
function missingPrereqs(c, ctx){ return c.req ? c.req.split(";").filter(cl => !clauseMet(cl, ctx)) : []; }

/* ---------- issues for an item ---------- */
function itemIssues(plan, it){
  const c = BY[it.cid], out = [];
  if (!c) return out;
  if (c.g && !c.g.includes(it.g)) out.push(`Open to ${gradeLabel(c)} grade${c.g.length>1?"rs":"ers"} only.`);
  if (!altOK(c, it.g)) out.push(`Runs every other year; not expected in ${schoolYear(it.g)}.`);
  const miss = missingPrereqs(c, context(plan, it.g, it.sem));
  if (miss.length) out.push("Needs " + miss.map(clauseText).join(" and ") + ".");
  const dupe = plan.items.filter(x => x.cid===it.cid);
  if (dupe.length>1 && dupe[0]!==it) out.push("Already in your plan.");
  return out;
}

/* ---------- year-level analysis ---------- */
function yearInfo(plan, g){
  const items = plan.items.filter(i => i.g===g);
  const sem = {S1:{acad:0, depts:new Set(), all:0, artcs:false}, S2:{acad:0, depts:new Set(), all:0, artcs:false}};
  let cr = 0, ap = 0;
  for (const it of items){ const c = BY[it.cid]; if (!c) continue;
    cr += c.cr; if (isAP(c)) ap++;
    for (const s of semsOf(it)){ const k = sem[s]; k.all++;
      if (isAcademic(c)) { k.acad++; k.depts.add(c.id==="5110" ? "hist" : c.d); }
      if (["fine","perf","cse"].includes(c.d)) k.artcs = true; }
  }
  const notes = [];
  if (items.length){
    const per = {S1:[], S2:[]};
    for (const s of ["S1","S2"]){ const k = sem[s], lab = "@";
      const notes = per[s];
      if (k.acad < 5) notes.push({t:`${lab} has ${k.acad} academic course${k.acad===1?"":"s"}; plan on 5.`});
      else if (k.acad === 6) notes.push({t:`${lab} has 6 academic courses, which needs a petition to the Academic Dean.`, info:true});
      else if (k.acad > 6) notes.push({t:`${lab} has ${k.acad} academic courses; the limit is 5 (6 with a petition).`});
      if (k.acad >= 4 && k.depts.size < 4) notes.push({t:`${lab}'s academic courses come from ${k.depts.size} departments; you need at least 4.`});
      if (g<=10 && k.acad>=5 && !k.artcs) notes.push({t:`${lab}: 9th and 10th graders are encouraged to add an art, performing art, or CS class as a sixth course.`, info:true});
    }
    // merge matching notes from both semesters
    for (const n of per.S1){ const twin = per.S2.find(m => m.t===n.t);
      notes.push({...n, t: n.t.replace("@", twin ? "Both semesters" : "Semester 1").replace("Both semesters has","Both semesters have").replace("Both semesters's","Each semester's")}); }
    for (const n of per.S2) if (!per.S1.some(m => m.t===n.t)) notes.push({...n, t:n.t.replace("@","Semester 2")});
    if (AP_CAP[g] && ap > AP_CAP[g]) notes.push({t:`${ap} AP/Advanced Topics courses; the limit in ${ORD[g]} grade is ${AP_CAP[g]}.`});
  }
  let flagged = 0; for (const it of items) if (itemIssues(plan, it).length) flagged++;
  return {items, sem, cr, ap, notes, flagged, warnCount: flagged + notes.filter(n=>!n.info).length};
}

/* ---------- graduation requirements ---------- */
function requirements(plan){
  const win = (lo,hi) => { const t = {}; for (const it of plan.items){ if (it.g<lo||it.g>hi) continue; const c = BY[it.cid]; if(!c) continue;
      for (const [d,v] of credSplit(c)) t[d] = (t[d]||0) + v; } return t; };

  const credits = [
    {title:"9th and 10th grade", lede:"Minimum credits by department across your first two years.", t:A, rows:[["eng",2],["math",2],["wl",2],["sci",2],["hist",1.5],["rel",.5],["arts",.5],["health",.25]]},

  ];
  const lang9 = plan.items.find(i => i.g===9 && BY[i.cid]?.d==="wl"), lang10 = plan.items.find(i => i.g===10 && BY[i.cid]?.d==="wl");
  const seqOK = lang9 && lang10 && (BY[lang10.cid].req||"").split("|").includes(lang9.cid);
  const done = new Set([...placementDone(), ...plan.items.map(i=>i.cid)]);
  const mathSeq = done.has("2110") && (done.has("2210")||done.has("2230")) && ["2310","2330","2330PA"].some(x=>done.has(x));
  const checks = [
    {ok:has(9,10,c=>GROUPS.BIO.includes(c.id)), t:"Biology by the end of 10th grade"},
    {ok:has(9,10,c=>GROUPS.CHEM.includes(c.id)), t:"Chemistry by the end of 10th grade"},

    {ok:has(9,10,c=>c.id==="9801"), t:"Health in 9th grade"},

    {ok:has(11,12,c=>/phys/.test(c.fl)), t:"A full year of Physics in 11th or 12th"},
    {ok:has(11,12,c=>/\bas\b/.test(c.fl)), t:"An American Studies (AS) history course", s:"American History and Government or AP U.S. History."},
    {ok:mathSeq, t:"Algebra I, Geometry, and Algebra II (or equivalents)", s:"Courses finished in middle school count, based on your starting math class."}
  ];
  return {credits, checks};
}
function actTotals(plan){ const per = {}; let total = 0;
  for (const g of GRADES){ const n = SEASONS.filter(s => (plan.acts?.[g]?.[s]||"").trim()).length; per[g] = Math.min(n,3); total += per[g]; }

/* ---------- sheet ---------- */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function openSheet(title, html, after){
  document.getElementById("shTitle").textContent = title;
  document.getElementById("shBody").innerHTML = html;
  document.getElementById("shBody").scrollTop = 0;
  sheet.classList.add("on"); scrim.classList.add("on");
  after && after(document.getElementById("shBody"));
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
scrim.onclick = closeSheet; document.getElementById("shClose").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 1800); }

/* ---------- picker ---------- */
let pk = {q:"", dept:"all", fit:true};
function fitsSlot(c, slot){
  const termOK = slot.sem==="Y" ? c.term==="Y" : (c.term===slot.sem || c.term==="S");
  return termOK && (!c.g || c.g.includes(slot.g)) && altOK(c, slot.g);
}
function courseRow(c, slot){
  const tags = `${isAP(c)?'<span class="tag ap">AP/AT</span>':""}${isHon(c)?'<span class="tag h">Honors</span>':""}${c.appr?`<span class="tag rec">${esc(c.appr)}</span>`:""}`;
  let status = "";
  if (slot){ const miss = missingPrereqs(c, context(P(), slot.g, slot.sem==="Y"?"S1":slot.sem));
    status = c.req ? (miss.length ? `<div class="rs">Needs ${esc(miss.map(clauseText).join(" and "))}</div>` : `<div class="rs ok">Prerequisites met</div>`) : ""; }
  const inPlan = P().items.some(i => i.cid===c.id);
  return `<button class="row ${slot && !fitsSlot(c,slot) ? "dim":""}" style="--c:${colorOf(c.d)}" data-cid="${c.id}">
    <span class="bar"></span><span style="flex:1">
      <div class="rt">${esc(c.t)}${inPlan?' <span class="tag">In plan</span>':""}</div>
      <div class="rm">${tags}${esc(termLabel(c))} · ${fmtCr(c.cr)} cr · ${esc(c.g ? gradeLabel(c)+" grade" : "Grades not listed")}</div>${status}
    </span></button>`;
}
function filtered(slot){
  const q = pk.q.trim().toLowerCase();
  return COURSES.filter(c => (pk.dept==="all" || c.d===pk.dept) && (!q || (c.t+" "+c.nums+" "+DEPTS[c.d][0]).toLowerCase().includes(q)) && (!slot || !pk.fit || fitsSlot(c, slot)));
}
function chipsHTML(){ return `<div class="chips">${[["all","All"],...Object.keys(DEPTS).map(k=>[k,SHORT[k]])].map(([k,l]) =>
  `<button class="chip ${pk.dept===k?"on":""}" data-d="${k}">${k!=="all"?`<span class="sw" style="background:${colorOf(k)}"></span>`:""}${l}</button>`).join("")}</div>`; }
function openPicker(slot, keep){
  if (!keep) pk.q = "";
  const title = `Add to ${ORD[slot.g]} grade · ${slot.sem==="Y"?"full year":slot.sem==="S1"?"Semester 1":"Semester 2"}`;
  const draw = body => {
    const list = filtered(slot);
    body.querySelector("#plist").innerHTML = list.length ? list.map(c=>courseRow(c,slot)).join("") : `<p class="fine" style="padding:14px 0">No ${pk.fit?"matching classes fit this spot. Turn off “Only classes that fit” to see everything.":"classes match that search."}</p>`;
    body.querySelector(".chips").outerHTML = chipsHTML();
    body.querySelectorAll(".chip").forEach(ch => ch.onclick = () => { pk.dept = ch.dataset.d; draw(body); });
    body.querySelectorAll(".row").forEach(r => r.onclick = () => openCourse(r.dataset.cid, slot));
  };
  openSheet(title, `<input class="search" id="pq" type="search" placeholder="Search classes" value="${esc(pk.q)}" autocomplete="off">
    ${chipsHTML()}<label class="toggle"><input type="checkbox" id="pfit" ${pk.fit?"checked":""}> Only classes that fit ${ORD[slot.g]} grade and this semester</label><div id="plist" style="min-height:55vh"></div>`,
    body => { draw(body);
      body.querySelector("#pq").oninput = e => { pk.q = e.target.value; draw(body); };
      body.querySelector("#pfit").onchange = e => { pk.fit = e.target.checked; draw(body); }; });
}

/* ---------- course detail ---------- */
function courseFacts(c){
  return `<dl class="facts">
    <dt>Department</dt><dd>${esc(DEPTS[c.d][0])}</dd>
    <dt>Course #</dt><dd>${esc(c.nums)}</dd>
    <dt>When</dt><dd>${esc(termLabel(c))}</dd>
    <dt>Credit</dt><dd>${fmtCr(c.cr)}${c.note && /3 times/.test(c.note) ? " · meets 3×/week" : ""}</dd>
    <dt>Grades</dt><dd>${esc(gradeLabel(c))}</dd>
    ${(c.pre||c.appr) ? `<dt>Requires</dt><dd>${esc(c.pre || c.appr)}</dd>` : ""}
    ${isAP(c) ? `<dt>Counts as</dt><dd>AP / Advanced Topics</dd>` : ""}
  </dl>`;
}
function openCourse(cid, slot){
  const c = BY[cid];
  let status = "", btns = "";
  if (slot){
    const fits = fitsSlot(c, slot);
    const semForCtx = slot.sem==="Y" ? "S1" : slot.sem;
    const miss = missingPrereqs(c, context(P(), slot.g, semForCtx));
    const probs = [];
    if (c.g && !c.g.includes(slot.g)) probs.push(`It's open to grades ${gradeLabel(c)}, not ${ORD[slot.g]}.`);
    if (slot.sem==="Y" && c.term!=="Y") probs.push("It's a semester class, so add it to Semester 1 or 2 instead.");
    if (slot.sem!=="Y" && c.term==="Y") probs.push("It's a full-year class, so add it with “+ Full year.”");
    if (slot.sem!=="Y" && c.term!=="Y" && c.term!=="S" && c.term!==slot.sem) probs.push(`It only runs in ${termLabel(c)}.`);
    if (!altOK(c, slot.g)) probs.push(`It runs every other year and isn't expected in ${schoolYear(slot.g)}.`);
    if (miss.length) probs.push(`Your plan doesn't have ${miss.map(clauseText).join(" and ")} before this.`);
    if (probs.length) status = `<div class="status bad">${probs.map(esc).join("<br>")}</div>`;
    else status = `<div class="status good">Fits ${ORD[slot.g]} grade${c.req?" and your plan has the prerequisites":""}.</div>`;
    if (c.appr) status += `<div class="status inf">Needs ${esc(c.appr==="Dept. Rec."?"a department recommendation":c.appr==="Instr."?"instructor approval":"an audition")}. The app can't check that part.</div>`;
    const termOK = slot.sem==="Y" ? c.term==="Y" : c.term!=="Y" && (c.term==="S" || c.term===slot.sem);
    btns = `<div class="btnrow"><button class="btn" id="doAdd" ${termOK?"":"disabled"}>Add to ${ORD[slot.g]} grade</button><button class="btn alt" id="back">Back</button></div>`;
  }
  const note = c.note ? `<div class="status inf">${esc(c.note)}</div>` : "";
  openSheet(c.t, `${courseFacts(c)}${status}${note}${btns}<p class="desc">${esc(c.desc)}</p>`, body => {
    const a = body.querySelector("#doAdd"); if (a) a.onclick = () => {
      P().items.push({cid, g:slot.g, sem: slot.sem}); save(); closeSheet(); renderAll(); toast(`Added ${c.t}`); };
    const b = body.querySelector("#back"); if (b) b.onclick = () => openPicker(slot, true);
  });
}
function openItem(idx){
  const plan = P(), it = plan.items[idx], c = BY[it.cid];
  const iss = itemIssues(plan, it);
  const move = c.term==="S" ? `<button class="btn alt" id="mv">Move to ${it.sem==="S1"?"Semester 2":"Semester 1"}</button>` : "";
  const otherG = GRADES.filter(g => g!==it.g && (!c.g || c.g.includes(g)));
  openSheet(c.t, `${courseFacts(c)}
    ${iss.length ? `<div class="status bad">${iss.map(esc).join("<br>")}</div>` : `<div class="status good">No problems found for ${ORD[it.g]} grade.</div>`}
    ${c.appr ? `<div class="status inf">Needs ${esc(c.appr==="Dept. Rec."?"a department recommendation":c.appr==="Instr."?"instructor approval":"an audition")}.</div>` : ""}
    ${c.note ? `<div class="status inf">${esc(c.note)}</div>` : ""}
    <div class="btnrow">${move}${otherG.length?`<select id="mvg" aria-label="Move to another grade" style="flex:1;min-width:140px"><option value="">Move to grade…</option>${otherG.map(g=>`<option value="${g}">${ORD[g]} grade</option>`).join("")}</select>`:""}</div>
    <div class="btnrow"><button class="btn danger" id="rm">Remove from plan</button></div>
    <p class="desc">${esc(c.desc)}</p>`, body => {
      body.querySelector("#rm").onclick = () => { plan.items.splice(idx,1); save(); closeSheet(); renderAll(); toast(`Removed ${c.t}`); };
      const m = body.querySelector("#mv"); if (m) m.onclick = () => { it.sem = it.sem==="S1"?"S2":"S1"; save(); closeSheet(); renderAll(); };
      const mg = body.querySelector("#mvg"); if (mg) mg.onchange = () => { if (!mg.value) return; it.g = +mg.value; save(); closeSheet(); renderAll(); toast(`Moved to ${ORD[it.g]} grade`); };
    });
}

/* ---------- check view ---------- */
function renderCheck(){
  const v = document.getElementById("v-check"), plan = P();
  if (!S.setup){ v.innerHTML = `<div class="sect"><p class="fine">Finish setup on the Plan tab first.</p></div>`; return; }
  const R = requirements(plan);

  let html = "";
  const okCount = R.checks.filter(c=>c.ok).length;
  html += `<div class="sect"><h2>Must-haves</h2><p class="lede">${okCount} of ${R.checks.length} in your plan.</p>
    ${R.checks.map(c=>`<div class="chk ${c.ok?"ok":"no"}"><span class="ic">${c.ok?"✓":"!"}</span><span>${esc(c.t)}${c.s?`<small>${esc(c.s)}</small>`:""}</span></div>`).join("")}</div>`;
  for (const blk of R.credits){
    html += `<div class="sect"><h2>${blk.title}</h2><p class="lede">${blk.lede}</p>${blk.rows.map(([d,need]) => { const have = blk.t[d]||0, pct = Math.min(100, have/need*100);
      return `<div class="req"><span class="n">${esc(cname(d))}</span><span class="v ${have>=need-1e-9?"done":""}">${fmtCr(have)} of ${fmtCr(need)}</span><div class="meter"><i style="width:${pct}%;--c:${ccol(d)}"></i></div></div>`; }).join("")}</div>`;
  }
  // load table
  html += `<div class="sect"><h2>Course load</h2><p class="lede">Each semester needs 5 academic classes from at least 4 departments. A sixth needs a petition.</p>
    <table class="load"><tr><th>Grade</th><th>Sem 1</th><th>Sem 2</th><th>AP/AT</th><th>Credits</th></tr>
    ${GRADES.map(g => { const y = yearInfo(plan,g); const cell = k => { const s = y.sem[k]; const bad = y.items.length && (s.acad<5 || s.acad>6 || s.depts.size<4); return `<td class="${bad?"bad":""}">${s.acad} in ${s.depts.size} dept${s.depts.size===1?"":"s"}</td>`; };
      const capBad = AP_CAP[g] && y.ap > AP_CAP[g];
      return `<tr><td><b>${ORD[g]}</b></td>${cell("S1")}${cell("S2")}<td class="${capBad?"bad":""}">${y.ap}${AP_CAP[g]?` / ${AP_CAP[g]}`:""}</td><td>${fmtCr(y.cr)}</td></tr>`; }).join("")}
    </table></div>`;
  // activities
  const A = actTotals(plan);
  html += `<div class="sect"><h2>Activities</h2><p class="lede">Students who start in 9th grade need 8 activity credits: 3 in 9th grade, and at most 3 count per year. Each sport season or activity session earns 1. Finishing by the end of 11th grade is recommended.</p>
    <div class="acts"><span></span><span class="h">Fall</span><span class="h">Winter</span><span class="h">Spring</span>
    ${GRADES.map(g => `<span class="g">${ORD[g]}</span>${SEASONS.map(s => `<input list="actlist" data-g="${g}" data-s="${s}" value="${esc(plan.acts?.[g]?.[s]||"")}" placeholder="—" aria-label="${ORD[g]} grade ${s}">`).join("")}`).join("")}
    </div><datalist id="actlist">${ACT_SUGGEST.map(a=>`<option value="${esc(a)}">`).join("")}</datalist>
    <div class="req" style="margin-top:10px"><span class="n">Activity credits</span><span class="v ${A.total>=8?"done":""}" id="actv">${A.total} of 8</span><div class="meter"><i id="actm" style="width:${Math.min(100,A.total/8*100)}%;--c:var(--sci)"></i></div></div>
    ${A.per[9]<3 ? `<div class="note info" id="act9" style="margin-top:6px">Plan 3 activities in 9th grade.</div>` : ""}
  </div>`;
  html += `<p class="fine" style="padding:0 6px">These checks follow the ${GUIDE}. Your adviser and the Academic Deans make the final call.</p>`;
  v.innerHTML = html;
  v.querySelectorAll(".acts input").forEach(inp => inp.oninput = () => {
    plan.acts = plan.acts || {}; plan.acts[inp.dataset.g] = plan.acts[inp.dataset.g] || {};
    plan.acts[inp.dataset.g][inp.dataset.s] = inp.value; save();
    const t = actTotals(plan); document.getElementById("actv").textContent = `${t.total} of 8`; document.getElementById("actv").classList.toggle("done", t.total>=8);
    document.getElementById("actm").style.width = Math.min(100,t.total/8*100)+"%";
    const n9 = document.getElementById("act9"); if (n9) n9.hidden = t.per[9]>=3;
  });
}

function openDept(d){
  const list = COURSES.filter(c => c.d===d).sort((a,b) => ((a.g?.[0]||13)-(b.g?.[0]||13)) || a.nums.localeCompare(b.nums));
  const row = c => `<button class="qrow" data-cid="${c.id}"><div class="rt">${esc(c.t)}${isAP(c)?' <span class="tag ap">AP/AT</span>':""}${isHon(c)?' <span class="tag h">Honors</span>':""}</div>
    <div class="rm">${esc(c.g ? gradeLabel(c)+" grade" : "Grades not listed")} · ${fmtCr(c.cr)} cr${c.appr?` · ${esc(c.appr)}`:""}</div><div class="bl">${esc(c.b)}</div></button>`;
  const yr = list.filter(c=>c.term==="Y"), sm = list.filter(c=>c.term!=="Y");

function openBrowse(cid, fromDept){

    ${S.setup?`<div class="btnrow"><button class="btn alt" id="wtg">${isWish(cid)?"♥ On your wish list":"♡ Add to wish list"}</button></div>`:""}

}

function planText(){
  const plan = P(); let t = `${S.setup?.name ? S.setup.name+"'s" : "My"} high school plan: ${plan.name}\n`;
  for (const g of GRADES){ const items = plan.items.filter(i=>i.g===g); t += `\n${ORD[g]} grade (${schoolYear(g)})\n`;
    if (!items.length) t += "  (nothing yet)\n";
    for (const s of ["Y","S1","S2"]) for (const it of items.filter(i=>i.sem===s)) { const c = BY[it.cid]; t += `  ${s==="Y"?"Full year":s==="S1"?"Sem 1":"Sem 2"}: ${c.t} (${fmtCr(c.cr)} cr)\n`; } }
  const R = requirements(plan); const miss = R.checks.filter(c=>!c.ok);
  t += `\nRequirements still open: ${miss.length ? miss.map(c=>c.t).join("; ") : "none"}\n`;
  return t;
}
async function sharePlan(){
  const text = planText();
  try { if (navigator.share) { await navigator.share({title:"High school plan", text}); return; } } catch(e) { if (e.name==="AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } catch(e) { openSheet("Plan text", `<textarea style="width:100%;height:60vh;font:inherit;font-size:14px">${esc(text)}</textarea>`); }
}
function exportBackup(){
  const blob = new Blob([JSON.stringify({app:"fouryears", v:1, data:S}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `four-years-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); const d = o.data || o; if (!d.plans) throw 0;
      if (!confirm("Replace the plans on this phone with the ones in this backup?")) return;
      S = d; S.cur = Math.min(S.cur||0, S.plans.length-1); save(); renderAll(); toast("Backup restored"); }
    catch(e){ toast("That file isn't a Four Years backup."); } };
  r.readAsText(file);
}

function fillCore(plan){
  const add = (cid,g,sem) => { const c = BY[cid]; if (c && (!c.g || c.g.includes(g))) plan.items.push({cid,g,sem:sem||(c.term==="Y"?"Y":c.term==="S"?"S1":c.term)}); };
  const st = S.setup;
  [["1110",9],["5110",9],["4110",9],["9801",9,"S1"],["1210",10],["5210",10],["4210",10],["1310",11],["5310",11]].forEach(a=>add(...a));
  const mathAt = {}; let m = st.math;
  for (const g of GRADES){ if (!m || !BY[m].g.includes(g)) break; add(m,g); mathAt[g] = MATH_RANK[m]||0; m = MATH_NEXT[m]; }
  add("4310", (mathAt[11]||0) >= 4 ? 11 : 12);
  if (st.lang){ const path = LANG_PATH[st.lang]; let i = st.level===2 ? 1 : 0;
    for (const g of GRADES){ const id = path[i]; if (!id) break; add(id,g); i++; } }
}

/* ---------- plan builder ---------- */
const tier = c => isAP(c) ? 2 : isHon(c) ? 1 : 0;
function BLD(){ S.build = S.build || {wishes:[], level:"balanced", prios:[], approved:[], declined:[]}; return S.build; }
const LEVELS = {steady:["Steady","Regular versions of required classes. Honors or AP only for classes on your wish list."],
  balanced:["Balanced","Honors where it fits, and AP classes in 11th and 12th grade."],
  stretch:["Stretch","The most challenging path the rules allow."]};
const PRIOS = {even:"Even workload across the years", arts:"An art or CS class every year", senior:"A lighter senior year", max:"As many honors and AP classes as possible"};
const LANG_PREFIX = {latin:"30", french:"31", spanish:"33", chinese:"34"};
const CORE_IDS = new Set(["1110","1210","1310","5110","9801","5210","5470","5310","5380","4110","4120","4200","4210","4220","4310","4320","4380","4390"]);
const trackOnly = c => c.d==="wl" || (c.d==="math" && c.term==="Y" && !["2700","2780"].includes(c.id)) || (CORE_IDS.has(c.id) && !["4310","4320","4380","4390"].includes(c.id));
const posBefore = (g1,s1,g2,s2) => g1<g2 || (g1===g2 && s1==="S1" && s2==="S2");
function reqOK(c, done, conc){ return !c.req || c.req.split(";").every(cl => clauseMet(cl, {done, conc})); }
function makeAllow(level, wishSet, approved){
  return (c,g) => wishSet.has(c.id) || approved.has(c.id) || level==="stretch" ||
    (level==="steady" ? tier(c)===0 : (tier(c)<=1 || g>=11));
}

function mathTracks(allow, strict){
  const out = [], mathY = COURSES.filter(c => c.d==="math" && c.term==="Y");
  const pairs = [["2863","2864"],["2881","2882"]];
  const rec = (g, done, track) => {
    if (g>12) { out.push(track); return; }
    const opts = [];
    if (g===9) opts.push([S.setup.math]);
    else {
      const r = maxRank(done);
      for (const c of mathY){
        if (done.has(c.id) || !c.g.includes(g) || !altOK(c,g)) continue;
        const rk = MATH_RANK[c.id] || 0; if (rk ? rk<=r : g<12) continue;
        if (!reqOK(c, done, new Set())) continue;
        if (strict && !allow(c,g)) continue;
        opts.push([c.id]);
      }
      if (g>=11 && done.has("2810")) for (const p of pairs)
        if (p.every(id => altOK(BY[id],g) && !done.has(id) && (!strict || allow(BY[id],g)))) opts.push(p);
    }
    for (const o of opts){ const d = new Set(done); o.forEach(x=>d.add(x)); rec(g+1, d, [...track, o]); }
  };
  rec(9, placementDone(), []);
  return out;
}
function sciTracks(mt, allow, strict){
  const base = placementDone(), out = [];
  const through = g => { const s = new Set(base); for (let y=9; y<=g; y++) mt[y-9].forEach(x=>s.add(x)); return s; };
  for (const bio of ["4110","4120"]){ if (strict && !allow(BY[bio],9)) continue;
    for (const chem of ["4200","4210","4220"]){ const C = BY[chem];
      const d = through(9); d.add(bio);
      if (!reqOK(C, d, new Set(mt[1])) || (strict && !allow(C,10))) continue;
      for (const py of [11,12]) for (const ph of ["4310","4320","4380","4390"]){ const P = BY[ph];
        const d2 = through(py-1); d2.add(bio); d2.add(chem);
        if (!reqOK(P, d2, new Set(mt[py-9])) || (strict && !allow(P,py))) continue;
        out.push({bio, chem, ph, py});
      }
    }
  }
  return out;
}
function langTracks(allow, strict){
  const st = S.setup, out = []; if (!st.lang) return [[null,null,null,null]];
  const pool = COURSES.filter(c => c.d==="wl" && c.id.startsWith(LANG_PREFIX[st.lang]));
  const start = LANG_PATH[st.lang][st.level===2 ? 1 : 0];
  const rec = (g, prev, done, track) => {
    if (g>12) { out.push(track); return; }
    if (g>=11) out.push([...track, ...Array(13-g).fill(null)]);     // stopping here is allowed after 10th
    const opts = g===9 ? [BY[start]] : pool.filter(c => !done.has(c.id) && c.g.includes(g) && c.req && c.req.split("|").includes(prev) && (!strict || allow(c,g)));
    for (const c of opts){ const d = new Set(done); d.add(c.id); rec(g+1, c.id, d, [...track, c.id]); }
  };
  rec(9, null, placementDone(), []);
  return out.filter(t => t[0] && t[1]);
}
function histTracks(allow, strict){
  const out = [];
  for (const a of ["5210","5470"]) for (const b of ["5310","5380"])
    if (!strict || (allow(BY[a],10) && allow(BY[b],11))) out.push([a,b]);
  return out;
}

function coreItems(k){
  const it = [], add = (cid,g,sem) => it.push({cid,g,sem:sem||"Y"});
  add("1110",9); add("5110",9); add("9801",9,"S1"); add("1210",10); add("1310",11);
  k.math.forEach((ids,i) => ids.length===1 ? add(ids[0],9+i) : (add(ids[0],9+i,"S1"), add(ids[1],9+i,"S2")));
  add(k.sci.bio,9); add(k.sci.chem,10); add(k.sci.ph,k.sci.py);
  k.lang.forEach((id,i) => id && add(id,9+i));
  add(k.hist[0],10); add(k.hist[1],11);
  return it;
}
function loads(items){
  const L = {}; for (const g of GRADES) L[g] = {S1:{a:0,n:0}, S2:{a:0,n:0}, ap:0, hard:0};
  for (const i of items){ const c = BY[i.cid]; if (isAP(c)) L[i.g].ap++; if (tier(c)) L[i.g].hard++;
    for (const s of semsOf(i)){ if (isAcademic(c)) L[i.g][s].a++; else if (c.d!=="health") L[i.g][s].n++; } }
  return L;
}
function slotProblem(c, g, sem, items){
  const L = loads(items)[g];
  for (const s of (sem==="Y" ? ["S1","S2"] : [sem])){
    if (isAcademic(c) ? L[s].a>=5 : L[s].n>=1) return isAcademic(c) ? "cap" : "art";
  }
  if (isAP(c) && AP_CAP[g] && L.ap >= AP_CAP[g]) return "ap";
  return null;
}
function slotsFor(c){
  const out = [];
  for (const g of GRADES){ if ((c.g && !c.g.includes(g)) || !altOK(c,g)) continue;
    if (c.term==="Y") out.push([g,"Y"]); else { if (c.term!=="S2") out.push([g,"S1"]); if (c.term!=="S1") out.push([g,"S2"]); } }
  return out;
}
function placeCourse(cid, items, ctx, depth, limit){
  const c = BY[cid]; if (items.some(i => i.cid===cid)) return {ok:true, already:true};
  let slots = slotsFor(c);
  if (limit) slots = slots.filter(([g,s]) => posBefore(g, s==="Y"?"S1":s, limit[0], limit[1]==="Y"?"S1":limit[1]) && !(g===limit[0] && s==="Y"));
  const L = loads(items);
  const loadOf = ([g,s]) => (s==="Y" ? L[g].S1.a+L[g].S2.a : L[g][s].a) + L[g].hard;
  slots.sort((a,b) => ctx.prios.includes("even") ? (loadOf(a)-loadOf(b) || a[0]-b[0]) : (a[0]-b[0] || loadOf(a)-loadOf(b)));
  const reasons = [];
  for (const [g,sem] of slots){
    const prob = slotProblem(c, g, sem, items); if (prob){ reasons.push({r:prob, g}); continue; }
    const mark = items.length, addedHere = [];
    const cx = () => context({items}, g, sem==="Y" ? "S1" : sem);
    let miss = missingPrereqs(c, cx());
    if (miss.length && depth < 3){
      for (const cl of miss){
        const opts = cl.replace("~","").split("|").filter(t => BY[t] && !trackOnly(BY[t]));
        for (const o of opts){ const r = placeCourse(o, items, ctx, depth+1, [g,sem]); if (r.ok){ if (!r.already) addedHere.push(o, ...(r.added||[])); break; } }
      }
      miss = missingPrereqs(c, cx());
    }
    if (miss.length){ items.length = mark; reasons.push({r:"pre", g, miss}); continue; }
    if (slotProblem(c, g, sem, items)){ items.length = mark; reasons.push({r:"cap", g}); continue; }
    items.push({cid, g, sem});
    return {ok:true, g, sem, added:addedHere, apSkip: reasons.some(x => x.r==="ap")};
  }
  return {ok:false, reasons};
}

function runBuild(opts){
  const {level, wishes, prios, approved, allowAll} = opts;
  const wishSet = new Set(wishes.map(w=>w.cid)), mustSet = new Set(wishes.filter(w=>w.must).map(w=>w.cid));
  const strictAllow = makeAllow(level, wishSet, approved);
  const allow = allowAll ? () => true : strictAllow;
  const val = cid => mustSet.has(cid) ? 100 : 30;
  let notes = [];
  let mts = mathTracks(allow, true);
  if (!mts.length){ mts = mathTracks(allow, false); notes.push("Your math placement leads straight into honors and AP math, so those stay in your plan even at this level."); }
  const lts = langTracks(allow, true), hts = histTracks(allow, true);
  const levelPts = c => { const t = tier(c); return (/Essentials|Conceptual/.test(c.t) && S.setup.math!=="2230" ? -.5 : 0) + (level==="steady" ? -3*t : level==="stretch" ? 2*t : (t===1 ? 1 : t===2 ? .5 : 0)) + (prios.includes("max") ? 2*t : 0); };
  const pts = (cid) => wishSet.has(cid) ? val(cid) : levelPts(BY[cid]);
  const cands = [];
  for (const mt of mts){
    const sts = sciTracks(mt, allow, true); if (!sts.length) continue;
    const mScore = mt.flat().reduce((a,id)=>a+pts(id),0);
    for (const st of sts){
      const sScore = pts(st.bio)+pts(st.chem)+pts(st.ph) + (st.py===11 ? .3 : 0);
      for (const lt of lts){
        const lScore = lt.reduce((a,id)=>a+(id ? pts(id) + (level==="steady"?.3:.8) : 0),0);
        for (const ht of hts) cands.push({k:{math:mt, sci:st, lang:lt, hist:ht}, s: mScore+sScore+lScore+pts(ht[0])+pts(ht[1])});
      }
    }
  }
  if (!cands.length) return {fail:true};
  // favor core paths that make elective wishes reachable (e.g., Chemistry IH for AP Biology)
  const pd = placementDone();
  const elWishes = wishes.filter(w => !trackOnly(BY[w.cid]) && BY[w.cid].req && slotsFor(BY[w.cid]).length);
  if (elWishes.length) for (const cand of cands){
    const at = {}; pd.forEach(id => at[id] = 8);
    const k = cand.k; k.math.forEach((ids,i)=>ids.forEach(id=>at[id]=9+i));
    at[k.sci.bio]=9; at[k.sci.chem]=10; at[k.sci.ph]=k.sci.py; k.lang.forEach((id,i)=>{ if(id) at[id]=9+i; }); at[k.hist[0]]=10; at[k.hist[1]]=11;
    for (const w of elWishes){ const c = BY[w.cid]; const G = Math.max(...slotsFor(c).map(x=>x[0]));
      const ok = c.req.split(";").every(cl => { const conc = cl.endsWith("~"); const okG = g => g!==undefined && (conc ? g<=G : g<G);
        return cl.replace("~","").split("|").some(t => {
          if (t.startsWith("m>=")) return Object.entries(at).some(([id,g]) => okG(g) && (MATH_RANK[id]||0) >= parseFloat(t.slice(3)));
          if (GROUPS[t]) return GROUPS[t].some(id => okG(at[id]));
          return BY[t] && trackOnly(BY[t]) ? okG(at[t]) : true; }); });
      if (ok) cand.s += val(w.cid)*0.9;
    }
  }
  cands.sort((a,b)=>b.s-a.s);
  const order = wishes.slice().sort((a,b) => (b.must-a.must) || (slotsFor(BY[a.cid]).length - slotsFor(BY[b.cid]).length));
  let best = null;
  for (const cand of cands.slice(0, 60)){
    const items = coreItems(cand.k), placed = {}, added = [], apMoves = [];
    let score = cand.s; const fails = {};
    for (const w of order){
      if (items.some(i=>i.cid===w.cid)) { placed[w.cid] = true; continue; }
      if (trackOnly(BY[w.cid])) { fails[w.cid] = []; continue; }
      const r = placeCourse(w.cid, items, {prios}, 0, null);
      if (r.ok){ placed[w.cid] = true; score += val(w.cid) + levelPts(BY[w.cid])*0.5;
        (r.added||[]).forEach(a => added.push([a, w.cid])); if (r.apSkip) apMoves.push(w.cid); }
      else fails[w.cid] = r.reasons;
    }
    const L = loads(items);
    if (prios.includes("even")){ const h = GRADES.map(g=>L[g].hard); score -= 1.5*(Math.max(...h)-Math.min(...h)); }
    if (prios.includes("senior")) score -= 2*L[12].hard;
    if (prios.includes("arts")) score += 2*GRADES.filter(g => items.some(i => i.g===g && ["fine","perf","cse"].includes(BY[i.cid].d))).length;
    if (!best || score > best.score) best = {score, items, placed, added, apMoves, fails, k:cand.k};
  }
  best.notes = notes; best.allow = strictAllow;
  return best;
}

/* reasons a wish didn't make it */
function failText(cid, res){
  const c = BY[cid];
  if (!slotsFor(c).length) return c.fl.includes("alt") ? "It runs every other year and isn't offered in a year you can take it." : "It isn't open to any grade you'll be in.";
  if (trackOnly(c)) return `It doesn't fit your ${DEPTS[c.d][0].toLowerCase()} path at this level.`;
  const rs = res.fails[cid] || [];
  const pre = rs.find(r => r.r==="pre"); if (pre) return `It needs ${pre.miss.map(clauseText).join(" and ")}, which your plan doesn't reach in time.`;
  if (rs.some(r=>r.r==="ap")) return "Every year it could go in already hits the AP/Advanced Topics limit.";
  if (rs.some(r=>r.r==="art")) return "The semesters it could go in already have an arts or CS class. Try making it a must-have.";
  return "Every semester it could go in already has 5 academic classes. Try making it a must-have or dropping another wish.";
}
function earnHint(item, items){
  const c = BY[item.cid];
  if (c.appr==="Audition") return "Prepare an audition.";
  if (c.appr==="Instr.") return "Get the instructor's OK, usually from how you did in the intro class.";
  const prev = items.filter(i => i.g < item.g && BY[i.cid].d===c.d).sort((a,b)=>b.g-a.g)[0];
  return prev ? `Earn it with strong work in ${BY[prev.cid].t} (${ORD[prev.g]}).` : "Based on your 8th-grade work, so finish middle school strong.";
}

function buildAll(){
  const b = BLD();
  const wishes = b.wishes.filter(w => !b.declined.includes(w.cid));
  const approved = new Set(b.approved);
  const res = runBuild({level:b.level, wishes, prios:b.prios, approved});
  if (res.fail) return res;
  // ask-first questions for wishes that only fit on a harder path
  res.questions = [];
  const missed = wishes.filter(w => !res.placed[w.cid]);
  for (const w of missed.slice(0,3)){
    const others = wishes.filter(x => res.placed[x.cid] || x.cid===w.cid).map(x => ({...x, must: x.cid===w.cid ? true : x.must}));
    const relaxed = runBuild({level:b.level, allowAll:true, wishes:others, prios:b.prios, approved});
    if (relaxed.fail || !relaxed.placed[w.cid]) continue;
    const extra = relaxed.items.filter(i => i.cid!==w.cid && !res.allow(BY[i.cid], i.g) && !others.some(o=>o.cid===i.cid));
    if (extra.length) res.questions.push({cid:w.cid, extra: extra.map(i=>[i.cid,i.g])});
  }
  return res;
}

/* ---------- builder UI ---------- */
let lastRes = null;
const isWish = cid => BLD().wishes.some(w => w.cid===cid);
function toggleWish(cid){ const b = BLD(); const i = b.wishes.findIndex(w=>w.cid===cid);
  if (i>=0) b.wishes.splice(i,1); else b.wishes.push({cid, must:false});
  b.declined = b.declined.filter(x=>x!==cid); lastRes = null; save(); }
function wishRowHTML(w){ const c = BY[w.cid];
  return `<div class="wrow" style="--c:${colorOf(c.d)}"><span class="bar"></span>
    <span class="wt"><b>${esc(c.t)}</b><small>${esc(c.g ? gradeLabel(c)+" grade" : "Grades not listed")} · ${esc(termLabel(c))}</small></span>
    <button class="mchip ${w.must?"on":""}" data-must="${w.cid}" aria-pressed="${w.must}">${w.must?"Must have":"Would like"}</button>
    <button class="rmx" data-rm="${w.cid}" aria-label="Remove ${esc(c.t)}">✕</button></div>`; }
function renderBuild(){
  const v = document.getElementById("v-build");
  if (!S.setup){ v.innerHTML = `<div class="sect"><p class="fine">Finish setup on the Plan tab first.</p></div>`; return; }
  const b = BLD();
  v.innerHTML = `
  <div class="sect"><h2>Your wish list</h2><p class="lede">Pick the classes you'd love to take. Must-haves get placed first.</p>
    ${b.wishes.length ? b.wishes.map(wishRowHTML).join("") : `<p class="fine" style="margin:4px 0 6px">Nothing yet. Add anything you're curious about: an art class, an AP, a senior elective.</p>`}
    <div class="btnrow"><button class="btn alt" id="wadd">+ Add classes</button></div></div>
  ${S.setup.lang ? "" : `<div class="sect"><h2>Your language</h2><p class="lede">Two years in a row of one language are required, so pick one to plan with.</p>
    <select id="blang"><option value="">Choose a language</option>${Object.entries(LANG_NAME).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>`}
  <div class="sect"><h2>How challenging?</h2><p class="lede">This decides between regular and honors versions of your required classes.</p>
    <div class="seg">${Object.entries(LEVELS).map(([k,[n]])=>`<button data-lv="${k}" class="${b.level===k?"on":""}">${n}</button>`).join("")}</div>
    <p class="fine" style="margin:8px 2px 0">${esc(LEVELS[b.level][1])}</p></div>
  <div class="sect"><h2>What matters to you?</h2><p class="lede">Pick any that sound right.</p>
    <div class="pchips">${Object.entries(PRIOS).map(([k,n])=>`<button class="chip ${b.prios.includes(k)?"on":""}" data-pr="${k}">${esc(n)}</button>`).join("")}</div></div>
  <div class="btnrow" style="margin:0 0 16px"><button class="btn big" id="bgo" ${S.setup.lang?"":"disabled"}>Build my plan</button></div>
  <div id="bres"></div>`;
  v.querySelector("#wadd").onclick = openWishPicker;
  v.querySelectorAll("[data-must]").forEach(x => x.onclick = () => { const w = b.wishes.find(w=>w.cid===x.dataset.must); w.must = !w.must; lastRes = null; save(); renderBuild(); });
  v.querySelectorAll("[data-rm]").forEach(x => x.onclick = () => { toggleWish(x.dataset.rm); renderBuild(); });
  v.querySelectorAll("[data-lv]").forEach(x => x.onclick = () => { b.level = x.dataset.lv; lastRes = null; save(); renderBuild(); });
  v.querySelectorAll("[data-pr]").forEach(x => x.onclick = () => { const k = x.dataset.pr; b.prios = b.prios.includes(k) ? b.prios.filter(p=>p!==k) : [...b.prios, k]; lastRes = null; save(); renderBuild(); });
  const bl = v.querySelector("#blang"); if (bl) bl.onchange = () => { if (!bl.value) return; S.setup.lang = bl.value; S.setup.level = S.setup.level||1; save(); renderBuild(); toast(`Planning with ${LANG_NAME[bl.value]} ${S.setup.level===2?"II":"I"}`); };
  v.querySelector("#bgo").onclick = () => { lastRes = buildAll(); renderResult(); document.getElementById("bres").scrollIntoView({behavior:"smooth"}); };
  if (lastRes) renderResult();
}
function renderResult(){
  const el = document.getElementById("bres"), b = BLD(), res = lastRes;
  if (!el || !res) return;
  if (res.fail){ el.innerHTML = `<div class="sect"><h2>No plan fits</h2><p class="lede">These settings don't leave a complete four-year path. Try a different challenge level or starting math class.</p></div>`; return; }
  const items = res.items, T = cid => esc(BY[cid].t);
  const where = cid => { const i = items.find(x=>x.cid===cid); return i ? `${ORD[i.g]} grade${i.sem==="Y"?"":i.sem==="S1"?", Sem 1":", Sem 2"}` : ""; };
  let h = "";
  // questions
  for (const q of res.questions){
    h += `<div class="sect qcard"><h2>Go for ${T(q.cid)}?</h2>
      <p class="lede">It only fits on a harder path. Your plan would need:</p>
      <ul class="qlist">${q.extra.map(([id,g])=>`<li><b>${T(id)}</b> in ${ORD[g]} grade${BY[id].appr?` <span class="tag rec">${esc(BY[id].appr)}</span>`:""}</li>`).join("")}</ul>
      <div class="btnrow"><button class="btn" data-qy="${q.cid}">Yes, take that path</button><button class="btn alt" data-qn="${q.cid}">No, skip it</button></div></div>`;
  }
  // wishes
  const wl = b.wishes;
  if (wl.length) h += `<div class="sect"><h2>Your wishes</h2>${wl.map(w => {
      if (b.declined.includes(w.cid)) return `<div class="chk"><span class="ic">–</span><span>${T(w.cid)}<small>You chose to skip it. <button class="linkb" data-undo="${w.cid}">Undo</button></small></span></div>`;
      if (res.placed[w.cid]) return `<div class="chk ok"><span class="ic">✓</span><span>${T(w.cid)}<small>${where(w.cid)}</small></span></div>`;
      const q = res.questions.find(q=>q.cid===w.cid);
      return `<div class="chk no"><span class="ic">!</span><span>${T(w.cid)}<small>${q ? "Answer the question above to include it." : esc(failText(w.cid, res))}</small></span></div>`;
    }).join("")}</div>`;
  // trade-offs
  const notes = [...res.notes];
  for (const [w, ids] of Object.entries(b.approvedFor||{})) if (res.placed[w] && !b.declined.includes(w)) notes.push(`${ids.map(id=>BY[id].t).join(" and ")} ${ids.length>1?"are":"is"} in your plan so you can take ${BY[w].t}.`);
  for (const [a, w] of res.added) notes.push(`Added ${BY[a].t} (${where(a)}) so you can take ${BY[w].t}.`);
  for (const w of res.apMoves) notes.push(`${BY[w].t} went to ${where(w)} because an earlier year was already at its AP/Advanced Topics limit.`);
  const lt = res.k.lang, lang = S.setup.lang && LANG_NAME[S.setup.lang];
  if (lang){ const last = lt.reduce((a,id,i)=>id?9+i:a, 9); notes.push(last===12 ? `${lang} all four years.` : `${lang} ends after ${ORD[last]} grade, which frees room for other classes. Only 9th and 10th are required.`); }
  if (res.k.sci.py===12) notes.push("Physics is in 12th grade, once your math is far enough along for it.");
  h += `<div class="sect"><h2>Choices and trade-offs</h2>${notes.map(n=>`<div class="tline">${esc(n)}</div>`).join("")}</div>`;
  // earn
  const earn = items.filter(i => BY[i.cid].appr).sort((a,b)=>a.g-b.g);
  h += `<div class="sect"><h2>What you'll need to earn</h2><p class="lede">${earn.length ? "These classes need a recommendation, approval, or audition. The app can't promise them, but here's where to aim." : "Nothing in this plan needs a recommendation or audition."}</p>
    ${earn.map(i=>`<div class="erow"><b>${T(i.cid)}</b> <span class="fine">${ORD[i.g]} grade</span> <span class="tag rec">${esc(BY[i.cid].appr)}</span><div class="fine">${esc(earnHint(i, items))}</div></div>`).join("")}</div>`;
  // still to pick
  const R = requirements({items});
  const todo = [];
  const sh = (blk, d) => Math.max(0, (blk.rows.find(r=>r[0]===d)?.[1]||0) - (blk.t[d]||0));
  const [A, B2] = R.credits;
  if (sh(A,"arts")) todo.push(`Pick ${fmtCr(sh(A,"arts"))} credit of fine or performing arts in 9th or 10th grade.`);
  if (sh(B2,"arts")) todo.push(`Pick ${fmtCr(sh(B2,"arts"))} credit of fine or performing arts in 11th or 12th grade.`);
  if (sh(B2,"rel")) todo.push("Pick a Religion & Philosophy class (one semester) in 11th or 12th grade.");
  if (sh(B2,"eng")) { const n = Math.round(sh(B2,"eng")*2); todo.push(n>1 ? `Pick ${n} senior English electives for 12th grade (one semester each).` : "Pick 1 senior English elective for 12th grade (one semester)."); }
  for (const c of R.checks) if (!c.ok) todo.push(`Still needed: ${c.t}.`);
  const L = loads(items);
  for (const g of GRADES){ const o1 = Math.max(0,5-L[g].S1.a), o2 = Math.max(0,5-L[g].S2.a);
    if (o1||o2) todo.push(`${ORD[g]} grade has open academic spots: ${o1} in Semester 1, ${o2} in Semester 2.`); }
  if (b.prios.includes("arts")) { const miss = GRADES.filter(g => !items.some(i=>i.g===g && ["fine","perf","cse"].includes(BY[i.cid].d))).map(g=>ORD[g]);
    if (miss.length) todo.push(`Add an art or CS class in ${miss.length>1 ? miss.slice(0,-1).join(", ")+(miss.length>2?",":"")+" and "+miss[miss.length-1] : miss[0]} grade, since you said that matters to you.`); }
  h += `<div class="sect"><h2>Still yours to pick</h2><p class="lede">${todo.length ? "Save the plan, then fill these in on the Plan tab." : "Nothing left. This plan is complete."}</p>${todo.map(t=>`<div class="tline">${esc(t)}</div>`).join("")}</div>`;
  // preview
  h += `<div class="sect"><h2>The plan</h2>${GRADES.map(g => `<div class="pv"><div class="pvg">${ORD[g]}</div><div class="pvl">${
      items.filter(i=>i.g===g).sort((a,b)=>"YS1S2".indexOf(a.sem)-"YS1S2".indexOf(b.sem)).map(i => `<span class="pvc" style="--c:${colorOf(BY[i.cid].d)}">${T(i.cid)}${i.sem!=="Y"?` <small>${i.sem==="S1"?"Sem 1":"Sem 2"}</small>`:""}${b.wishes.some(w=>w.cid===i.cid)?" ♥":""}</span>`).join("")}</div></div>`).join("")}
    <label class="f" for="bname">Plan name</label><input class="tx" id="bname" value="${esc(LEVELS[b.level][0])} plan">
    <div class="btnrow"><button class="btn" id="bsave">Save as a new plan</button></div>
    <p class="fine">Your other plans stay as they are.</p></div>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-qy]").forEach(x => x.onclick = () => { const q = res.questions.find(q=>q.cid===x.dataset.qy);
    b.approved = [...new Set([...b.approved, ...q.extra.map(e=>e[0])])]; b.approvedFor = b.approvedFor||{}; b.approvedFor[q.cid] = q.extra.map(e=>e[0]);
    save(); lastRes = buildAll(); renderResult(); toast("Plan rebuilt"); });
  el.querySelectorAll("[data-qn]").forEach(x => x.onclick = () => { b.declined.push(x.dataset.qn); save(); lastRes = buildAll(); renderResult(); toast("Plan rebuilt"); });
  el.querySelectorAll("[data-undo]").forEach(x => x.onclick = () => { b.declined = b.declined.filter(d=>d!==x.dataset.undo); save(); lastRes = buildAll(); renderResult(); });
  el.querySelector("#bsave").onclick = () => { const p = blankPlan(el.querySelector("#bname").value.trim() || "Built plan");
    p.items = items.map(i=>({...i})); S.plans.push(p); S.cur = S.plans.length-1; save(); setView("plan"); toast(`Saved ${p.name}`); };
}
function openWishPicker(){
  pk.q = "";
  const draw = body => {
    const list = filtered(null);
    body.querySelector("#wlist").innerHTML = list.map(c => `<button class="row" style="--c:${colorOf(c.d)}" data-w="${c.id}"><span class="bar"></span><span style="flex:1">
      <div class="rt">${esc(c.t)}</div><div class="rm">${esc(c.g ? gradeLabel(c)+" grade" : "Grades not listed")} · ${esc(termLabel(c))}${c.appr?` · ${esc(c.appr)}`:""}</div><div class="bl">${esc(c.b)}</div></span>
      <span class="heart ${isWish(c.id)?"on":""}" aria-label="${isWish(c.id)?"On":"Not on"} wish list">${isWish(c.id)?"♥":"♡"}</span></button>`).join("") || `<p class="fine">No classes match that search.</p>`;
    body.querySelector(".chips").outerHTML = chipsHTML();
    body.querySelectorAll(".chip").forEach(ch => ch.onclick = () => { pk.dept = ch.dataset.d; draw(body); });
    body.querySelectorAll("[data-w]").forEach(r => r.onclick = () => { toggleWish(r.dataset.w); const on = isWish(r.dataset.w); const h = r.querySelector(".heart"); h.textContent = on?"♥":"♡"; h.classList.toggle("on", on); });
  };
  openSheet("Add to your wish list", `<input class="search" id="wq" type="search" placeholder="Search classes" autocomplete="off">${chipsHTML()}
    <p class="fine" style="margin:0 0 4px">Tap a class to add or remove it.</p><div id="wlist" style="min-height:55vh"></div>
    <div class="btnrow" style="position:sticky;bottom:0;background:#fff;padding:8px 0"><button class="btn" id="wdone">Done</button></div>`, body => {
      draw(body); body.querySelector("#wq").oninput = e => { pk.q = e.target.value; draw(body); };
      body.querySelector("#wdone").onclick = () => { closeSheet(); renderBuild(); };
    });
}

/* ---------- boot ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setView(b.dataset.v));
load(); renderAll();
</script>
</body>
